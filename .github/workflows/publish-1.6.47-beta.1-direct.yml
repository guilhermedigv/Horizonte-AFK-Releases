name: Publicar Horizonte AFK 1.6.47 beta1 direct
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.6.47-beta.1-direct.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar build validada
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-48d0-820e-be37-77b2120a19e8/raw?se=2026-09-07T06%3A09%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=620e8263-560f-50ee-8414-39644d22ab91&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T12%3A50%3A25Z&ske=2026-09-07T12%3A50%3A25Z&sks=b&skv=2026-02-06&sig=wj8b4BVWj0t1in/0wbOsreNzZ8mWfvahwpXwDJAQzGI%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o artifact.zip
          rm -rf artifact && mkdir artifact
          unzip -q artifact.zip -d artifact
          EXE="$(find artifact -type f -name 'Horizonte_AFK.exe' -print -quit)"
          test -n "$EXE"
          cp "$EXE" Horizonte_AFK.exe
          SIZE=$(stat -c '%s' Horizonte_AFK.exe)
          SHA=$(sha256sum Horizonte_AFK.exe | cut -d' ' -f1)
          test "$SIZE" = '5907968'
          test "$SHA" = '8068e011a890ac45541266d63870fa510239252d8ba1ffbc1a0df0b72ffe8939'
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
      - name: Publicar release e manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='Corrige o erro Get-HZCloudStartedAtFromRemote da v1.6.46. A sessão Cloud já era criada, mas a UI falhava ao anexar a sessão à página porque três helpers de página foram removidos por engano durante a estabilização. A v1.6.47 restaura esses helpers e adiciona uma auditoria automática que falha a build se qualquer comando HZ usado no runtime não possuir definição. Mantém o modo 100% 24/7, páginas independentes, chat por página e desconexão individual.'
          if gh release view 'v1.6.47-beta.1' >/dev/null 2>&1; then
            gh release upload 'v1.6.47-beta.1' Horizonte_AFK.exe --clobber
            gh release edit 'v1.6.47-beta.1' --notes "$NOTES"
          else
            gh release create 'v1.6.47-beta.1' Horizonte_AFK.exe --title 'Horizonte AFK v1.6.47-beta.1' --notes "$NOTES" --prerelease
          fi
          cat > latest.json <<EOF
          {
            "product": "Horizonte AFK",
            "channel": "beta",
            "version": "1.6.47-beta.1",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "available": true,
            "mandatory": false,
            "download_url": "https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.47-beta.1/Horizonte_AFK.exe",
            "sha256": "$SHA",
            "size_bytes": $SIZE,
            "encoding": "none",
            "notes": "Corrige helpers Cloud de pagina ausentes e adiciona auditoria contra comandos HZ indefinidos.",
            "min_supported_version": "1.2.0"
          }
          EOF
          git config user.name 'Horizonte AFK Release CI'
          git config user.email 'actions@users.noreply.github.com'
          git add latest.json
          git commit -m 'release: v1.6.47-beta.1' || true
          git push
