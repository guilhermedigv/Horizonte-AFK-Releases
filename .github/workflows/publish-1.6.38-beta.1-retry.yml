name: Publicar Horizonte AFK 1.6.39 beta1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.6.38-beta.1-retry.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir build validada
        run: |
          set -euo pipefail
          curl -fL 'https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.38-beta.1/Horizonte_AFK.exe' -o base138.exe
          test "$(stat -c '%s' base138.exe)" = '5872640'
          test "$(sha256sum base138.exe | cut -d' ' -f1)" = '8ae1088a4b307d192461a8bf6f4c6f5e8b229cd76efa8fd3614201e1caee8860'
          cat .release-staging/v1.6.39.patch.00.b64 .release-staging/v1.6.39.patch.01.b64 | base64 -d > patch.zst
          test "$(stat -c '%s' patch.zst)" = '14763'
          test "$(sha256sum patch.zst | cut -d' ' -f1)" = '6990cb2bf6743ef666f35ccc0b6ad74479c517c1a14903c420d39628801543de'
          zstd -d -f --patch-from=base138.exe patch.zst -o Horizonte_AFK.exe
          SIZE=$(stat -c '%s' Horizonte_AFK.exe)
          SHA=$(sha256sum Horizonte_AFK.exe | cut -d' ' -f1)
          test "$SIZE" = '5872640'
          test "$SHA" = '52298347aa8794952f999bfc6682c20ab50ab1d303320c4e166667e13a20e690'
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
      - name: Publicar release e manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='Corrige a falha ao conectar outra conta local com sessao 24/7 ativa. A rotina aditiva agora usa targetHost em vez da variavel automatica somente leitura Host do PowerShell.'
          gh release create 'v1.6.39-beta.1' Horizonte_AFK.exe --title 'Horizonte AFK v1.6.39-beta.1' --notes "$NOTES" --prerelease
          cat > latest.json <<EOF
          {
            "product": "Horizonte AFK",
            "channel": "beta",
            "version": "1.6.39-beta.1",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "available": true,
            "mandatory": false,
            "download_url": "https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.39-beta.1/Horizonte_AFK.exe",
            "sha256": "$SHA",
            "size_bytes": $SIZE,
            "encoding": "none",
            "notes": "Corrige falha de conexao aditiva causada por colisao com a variavel automatica Host do PowerShell.",
            "min_supported_version": "1.2.0"
          }
          EOF
          git config user.name 'Horizonte AFK Release CI'
          git config user.email 'actions@users.noreply.github.com'
          git add latest.json
          git rm -f .release-staging/v1.6.39.patch.00.b64 .release-staging/v1.6.39.patch.01.b64 || true
          git commit -m 'release: v1.6.39-beta.1' || true
          git push
