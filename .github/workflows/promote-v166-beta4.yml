name: Promover Horizonte AFK 1.6.6-beta.4

on:
  push:
    branches: [main]
    paths:
      - '.release-v1.6.6-beta.4'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-5ad4-820e-b372-2d3175cc2cca/raw?se=2026-09-06T08%3A00%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=a6bdbefb-bd3d-56df-87dd-f587783120d8&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T22%3A15%3A24Z&ske=2026-09-06T22%3A15%3A24Z&sks=b&skv=2026-02-06&sig=sK%2BrzcX72J/07REUxnJR1n8n7d0KOTQDXtCzDFofr9w%3D'
      ZIP_SHA256: '1e7d077e6a01c1a6006e1df27b293d44d3c99387c6a1ce3d29d3daad77c1677c'
      EXPECTED_EXE_SHA256: 'df1fd8fdbe9f7c9b96fd5f6b38f1aa0b26d2823b86a9a7bc9e3701564eb63c49'
      EXPECTED_EXE_SIZE: '2928640'
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e validar artefato testado
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 1 "$ARTIFACT_URL" -o /tmp/Horizonte-AFK-1.6.6-beta.4.zip
          echo "$ZIP_SHA256  /tmp/Horizonte-AFK-1.6.6-beta.4.zip" | sha256sum -c -
          rm -rf /tmp/hz166b4 && mkdir -p /tmp/hz166b4
          unzip -q /tmp/Horizonte-AFK-1.6.6-beta.4.zip -d /tmp/hz166b4
          test -f /tmp/hz166b4/Horizonte_AFK.exe
          test "$(od -An -tx1 -N2 /tmp/hz166b4/Horizonte_AFK.exe | tr -d ' \n')" = "4d5a"
          SIZE="$(stat -c%s /tmp/hz166b4/Horizonte_AFK.exe)"
          SHA="$(sha256sum /tmp/hz166b4/Horizonte_AFK.exe | awk '{print $1}')"
          test "$SIZE" = "$EXPECTED_EXE_SIZE"
          test "$SHA" = "$EXPECTED_EXE_SHA256"
          echo "EXE_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "EXE_SHA256=$SHA" >> "$GITHUB_ENV"

      - name: Preparar candidato v1.6.6-beta.4
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/hz166b4/Horizonte_AFK.exe ./Horizonte_AFK.exe
          printf '%s  Horizonte_AFK.exe\n' "$EXE_SHA256" > SHA256SUMS.txt
          python3 - <<'PY'
          import json, os
          meta={
            'product':'Horizonte AFK',
            'channel':'beta',
            'version':'1.6.6-beta.4',
            'published_at':'2026-09-06T07:58:00.000Z',
            'available':True,
            'mandatory':False,
            'download_url':'https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.6-beta.4/Horizonte_AFK.exe',
            'sha256':os.environ['EXE_SHA256'],
            'size_bytes':int(os.environ['EXE_SIZE']),
            'encoding':'none',
            'notes':'Alinha o modo 24/7 ao mesmo fluxo do modo local: Still + spawn manual no backend, com login/2FA/dialogs antes do spawn.',
            'min_supported_version':'1.2.0'
          }
          open('release-candidate.json','w',encoding='utf-8').write(json.dumps(meta,ensure_ascii=False,indent=2)+'\n')
          p='release-changelog.json'
          try:
              d=json.load(open(p,encoding='utf-8-sig'))
          except Exception:
              d={'channel':'beta','versions':[]}
          d['channel']='beta'
          d['versions']=[v for v in d.get('versions',[]) if v.get('version')!='1.6.6-beta.4']
          d['versions'].insert(0,{
            'version':'1.6.6-beta.4','date':'2026-09-06','changes':[
              'Modo 24/7 passa a usar o mesmo runmode Still do modo local.',
              'O EXE só permite conexão Cloud quando o backend confirma manual_spawn_flow=true.',
              'Login, 2FA e demais dialogs devem ocorrer antes do spawn, como na conexão local.',
              'Mantidos console/chat puro, diagnóstico de IP e fail-safe do modo local.'
            ]})
          open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          cat > RELEASE_NOTES.md <<EOF
          # Horizonte AFK 1.6.6-beta.4

          Fluxo Cloud alinhado ao modo local.

          - Usa modo Still na sessão Cloud, igual ao launcher local.
          - Exige backend Cloud v0.4.2 com manual_spawn=1 antes de permitir conectar.
          - O RakSAMP não deve mais pular login/2FA nem tentar spawn prematuro.
          - Dialogs reais continuam aparecendo no próprio Horizonte AFK.
          - Mantém console/chat puro, diagnóstico de IP e modo local intacto.

          SHA-256: `$EXE_SHA256`
          EOF

      - name: Promover somente após validações
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Horizonte AFK Release Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add Horizonte_AFK.exe SHA256SUMS.txt release-candidate.json release-changelog.json RELEASE_NOTES.md
          git commit -m 'Promove Horizonte AFK v1.6.6-beta.4 validado'
          git push
