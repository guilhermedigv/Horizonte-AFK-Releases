name: Publicar Horizonte AFK 1.6.51 beta1 chat runtime fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.6.51-beta.1-chat-runtime-fix.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirmar base publica
        run: |
          set -euo pipefail
          test "$(jq -r '.version' latest.json)" = '1.6.50-beta.1'
      - name: Baixar candidato exato validado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf artifact && mkdir artifact
          gh run download 34176792570 --repo "$GITHUB_REPOSITORY" --name 'Horizonte-AFK-v1.6.51-chat-runtime-fix-candidate' --dir artifact
          EXE="$(find artifact -type f -name 'Horizonte_AFK.exe' -print -quit)"
          test -n "$EXE"
          cp "$EXE" Horizonte_AFK.exe
          SIZE=$(stat -c '%s' Horizonte_AFK.exe)
          SHA=$(sha256sum Horizonte_AFK.exe | cut -d' ' -f1)
          test "$SIZE" = '5908992'
          test "$SHA" = '4d8084036d42b801a7501d44fdf0c10a1156dc07c56ca1430ee5ee015694bb91'
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
      - name: Publicar release e manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='Corrige o erro ao abrir CONEXÕES E CHAT em que o PowerShell interpretava throw seguido da mensagem como um comando inexistente. Também remove o limite local remanescente de 5 páginas/contas do launcher, alinhando o cliente com a Cloud sem limite artificial. Mantidos o roteamento por conta e as proteções das versões anteriores.'
          if gh release view 'v1.6.51-beta.1' >/dev/null 2>&1; then
            gh release upload 'v1.6.51-beta.1' Horizonte_AFK.exe --clobber
            gh release edit 'v1.6.51-beta.1' --notes "$NOTES"
          else
            gh release create 'v1.6.51-beta.1' Horizonte_AFK.exe --title 'Horizonte AFK v1.6.51-beta.1' --notes "$NOTES" --prerelease
          fi
          cat > latest.json <<EOF
          {
            "product": "Horizonte AFK",
            "channel": "beta",
            "version": "1.6.51-beta.1",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "available": true,
            "mandatory": false,
            "download_url": "https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.51-beta.1/Horizonte_AFK.exe",
            "sha256": "$SHA",
            "size_bytes": $SIZE,
            "encoding": "none",
            "notes": "Corrige a abertura de CONEXÕES E CHAT e remove o limite local remanescente de 5 contas/páginas.",
            "min_supported_version": "1.2.0"
          }
          EOF
          git config user.name 'Horizonte AFK Release CI'
          git config user.email 'actions@users.noreply.github.com'
          git add latest.json
          git commit -m 'release: v1.6.51-beta.1'
          git push
