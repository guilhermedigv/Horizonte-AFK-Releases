name: Promover Horizonte AFK 1.6.5-hotfix

on:
  push:
    paths:
      - '.release-v1.6.5-hotfix'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-8e9c-820e-b497-a753f6ca69ae/raw?se=2026-09-06T06%3A54%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=a1b29ead-d7ad-5071-9523-df4e2272328e&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T22%3A26%3A47Z&ske=2026-09-06T22%3A26%3A47Z&sks=b&skv=2026-02-06&sig=IZSU%2B8ToGhnFl73wwnosk5dLqTxw5sKNDvGZKEMfiLU%3D'
      ZIP_SHA256: '2da7fd0b3d151232fadb92acbe3a646af5714af3338059270adcbf9704260df2'
      EXE_SHA256: '4f9f7424021ed824413f637d21a9561a1b34de6be29ba36b5ef877a377c2d862'
      EXE_SIZE: '2902016'
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e validar correção emergencial
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 1 "$ARTIFACT_URL" -o /tmp/Horizonte-AFK-1.6.5-hotfix.zip
          echo "$ZIP_SHA256  /tmp/Horizonte-AFK-1.6.5-hotfix.zip" | sha256sum -c -
          rm -rf /tmp/hz165 && mkdir -p /tmp/hz165
          unzip -q /tmp/Horizonte-AFK-1.6.5-hotfix.zip -d /tmp/hz165
          test -f /tmp/hz165/Horizonte_AFK.exe
          test "$(sha256sum /tmp/hz165/Horizonte_AFK.exe | awk '{print $1}')" = "$EXE_SHA256"
          test "$(stat -c%s /tmp/hz165/Horizonte_AFK.exe)" = "$EXE_SIZE"
          test "$(od -An -tx1 -N2 /tmp/hz165/Horizonte_AFK.exe | tr -d ' \n')" = "4d5a"
      - name: Preparar metadados da correção
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/hz165/Horizonte_AFK.exe ./Horizonte_AFK.exe
          printf '%s  Horizonte_AFK.exe\n' "$EXE_SHA256" > SHA256SUMS.txt
          cat > release-candidate.json <<'JSON'
          {
            "product": "Horizonte AFK",
            "channel": "stable",
            "version": "1.6.5-hotfix",
            "published_at": "2026-09-06T06:50:00.000Z",
            "available": true,
            "mandatory": false,
            "download_url": "https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.5-hotfix/Horizonte_AFK.exe",
            "sha256": "4f9f7424021ed824413f637d21a9561a1b34de6be29ba36b5ef877a377c2d862",
            "size_bytes": 2902016,
            "encoding": "none",
            "notes": "Correção emergencial: restaura a base estável v1.6.3 após a regressão que podia fazer o v1.6.4-beta.2 abrir sem exibir a interface.",
            "min_supported_version": "1.2.0"
          }
          JSON
          cat > RELEASE_NOTES.md <<'MD'
          # Horizonte AFK 1.6.5-hotfix

          Correção emergencial de recuperação.

          - Remove temporariamente a integração Cloud 24/7 que causou falha de abertura em alguns builds beta.
          - Restaura integralmente a base comprovadamente estável da v1.6.3.
          - Mantém updater, bandeja, tela cheia, multi-servidor, conta adicional, login, 2FA e dialogs locais.
          - O modo Cloud será reintegrado depois em uma beta separada, sem afetar a versão estável.

          SHA-256: `4f9f7424021ed824413f637d21a9561a1b34de6be29ba36b5ef877a377c2d862`
          MD
          python3 - <<'PY'
          import json
          p='release-changelog.json'
          d=json.load(open(p,encoding='utf-8-sig'))
          d['channel']='stable'
          d['versions']=[v for v in d.get('versions',[]) if v.get('version')!='1.6.5-hotfix']
          d['versions'].insert(0,{
            'version':'1.6.5-hotfix','date':'2026-09-06','changes':[
              'Correção emergencial para o caso em que a v1.6.4-beta.2 podia iniciar sem exibir a interface.',
              'Base visual e núcleo restaurados para o comportamento comprovadamente estável da v1.6.3.',
              'Mantidos updater, bandeja, tela cheia, multi-servidor, conta adicional, login, 2FA e dialogs locais.',
              'Integração Cloud 24/7 removida temporariamente da stable para ser revalidada em beta separada.'
            ]})
          open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Promover correção para o canal GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Horizonte AFK Release Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add Horizonte_AFK.exe SHA256SUMS.txt release-candidate.json release-changelog.json RELEASE_NOTES.md
          git commit -m 'Promove executável validado do Horizonte AFK 1.6.5-hotfix'
          git push
