name: Publicar Horizonte AFK 1.6.36 beta1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.6.36-beta.1.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar build validada
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-82d4-820e-afdb-360bb53d371f/raw?se=2026-09-07T02%3A05%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=dc8c4116-f031-5e1d-a694-eed4bdd64816&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T21%3A30%3A46Z&ske=2026-09-07T21%3A30%3A46Z&sks=b&skv=2026-02-06&sig=H/QQ7n1o%2BPrzo1u79myP91BXHVOy%2BpX1fM2rA0ROiZM%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o artifact.zip
          rm -rf artifact && mkdir artifact
          unzip -q artifact.zip -d artifact
          EXE="$(find artifact -type f -name 'Horizonte_AFK.exe' -print -quit)"
          test -n "$EXE"
          cp "$EXE" Horizonte_AFK.exe
          SIZE=$(stat -c '%s' Horizonte_AFK.exe)
          SHA=$(sha256sum Horizonte_AFK.exe | awk '{print $1}')
          test "$SIZE" = '5872640'
          test "$SHA" = '8007948ebb5e471cea1762114ca14dce1875097ca14395c0ca56d6c1e250704c'
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
      - name: Publicar release e manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='Interface de conexão unificada: o botão principal agora escolhe um ou vários servidores, com um nick independente para cada servidor. O botão separado de multi-servidor foi removido da interface. Cada combinação servidor + nick é salva automaticamente no Centro de Contas e reutilizada como sugestão na próxima conexão. Uma única seleção continua usando o fluxo local normal; duas ou mais iniciam simultaneamente pelo multi-servidor, mantendo o bridge nativo de dialogs da 1.6.35. O modo 24/7 na nuvem continua separado e preservado.'
          if gh release view 'v1.6.36-beta.1' >/dev/null 2>&1; then
            gh release upload 'v1.6.36-beta.1' Horizonte_AFK.exe --clobber
          else
            gh release create 'v1.6.36-beta.1' Horizonte_AFK.exe --title 'Horizonte AFK v1.6.36-beta.1' --notes "$NOTES" --prerelease
          fi
          cat > latest.json <<EOF
          {
            "product": "Horizonte AFK",
            "channel": "beta",
            "version": "1.6.36-beta.1",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "available": true,
            "mandatory": false,
            "download_url": "https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.36-beta.1/Horizonte_AFK.exe",
            "sha256": "$SHA",
            "size_bytes": $SIZE,
            "encoding": "none",
            "notes": "Conexão local unificada no botão principal, com seleção de um ou vários servidores e nick independente salvo por servidor no Centro de Contas.",
            "min_supported_version": "1.2.0"
          }
          EOF
          git config user.name 'Horizonte AFK Release CI'
          git config user.email 'actions@users.noreply.github.com'
          git add latest.json
          git commit -m 'release: v1.6.36-beta.1' || true
          git push
