name: Publicar Horizonte AFK 1.6.28 beta1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.6.28-beta.1.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar build validada
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-0e54-820e-920b-8f7072f27392/raw?se=2026-09-06T23%3A44%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=423d942b-4a0c-58eb-bf42-4edd2f3b78a9&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T12%3A05%3A04Z&ske=2026-09-07T12%3A05%3A04Z&sks=b&skv=2026-02-06&sig=xKrTwnNAcmTGpYck1q/3KnSPcw/ZfxBAy%2BSV1JD3mx0%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o artifact.zip
          rm -rf artifact && mkdir artifact
          unzip -q artifact.zip -d artifact
          EXE="$(find artifact -type f -name 'Horizonte_AFK.exe' -print -quit)"
          test -n "$EXE"
          cp "$EXE" Horizonte_AFK.exe
          SIZE=$(stat -c '%s' Horizonte_AFK.exe)
          SHA=$(sha256sum Horizonte_AFK.exe | awk '{print $1}')
          test "$SIZE" = '5840384'
          test "$SHA" = 'be55428859f845a40a6893da40373e267b8f3f23b1b01bf7e1ba79eaca373006'
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
      - name: Publicar release e manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='Corrige dois problemas observados na v1.6.27. No multi-servidor, o painel agora acompanha imediatamente a troca real de diálogo do processo filho e bloqueia cliques em um diálogo antigo; assim, quando o servidor passa de Escolha uma opção para Digite sua senha, a tela central também muda antes de aceitar outra resposta. Além disso, se o mesmo nick já estiver ativo 24/7 na Discloud em um dos servidores selecionados, esse servidor passa a contar como já conectado na nuvem e não é aberto novamente localmente, evitando a recusa de nick duplicado. O restante da fila continua normalmente. Contas, Cloud 24/7, dialogs, updater, layout e otimizações anteriores foram preservados.'
          if gh release view 'v1.6.28-beta.1' >/dev/null 2>&1; then
            gh release upload 'v1.6.28-beta.1' Horizonte_AFK.exe --clobber
          else
            gh release create 'v1.6.28-beta.1' Horizonte_AFK.exe --title 'Horizonte AFK v1.6.28-beta.1' --notes "$NOTES" --prerelease
          fi
          cat > latest.json <<EOF
          {
            "product": "Horizonte AFK",
            "channel": "beta",
            "version": "1.6.28-beta.1",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "available": true,
            "mandatory": false,
            "download_url": "https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.28-beta.1/Horizonte_AFK.exe",
            "sha256": "$SHA",
            "size_bytes": $SIZE,
            "encoding": "none",
            "notes": "Sincroniza o diálogo visível do multi-servidor com a etapa real do servidor e evita abrir uma sessão local duplicada quando o mesmo nick/servidor já está ativo 24/7 na nuvem.",
            "min_supported_version": "1.2.0"
          }
          EOF
          git config user.name 'Horizonte AFK Release CI'
          git config user.email 'actions@users.noreply.github.com'
          git add latest.json
          git commit -m 'release: v1.6.28-beta.1' || true
          git push
