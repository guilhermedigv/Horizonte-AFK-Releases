name: Publicar Horizonte AFK 1.6.26 beta1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.6.26-beta.1.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar build validada
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-6598-820e-bae9-b1710d746cf4/raw?se=2026-09-06T23%3A12%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=57ba1888-3286-50e6-b41b-a7106877b006&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T21%3A30%3A46Z&ske=2026-09-07T21%3A30%3A46Z&sks=b&skv=2026-02-06&sig=U1p/iL6VQDzRcEkJpUOyArclPZYV0Z41u8CHkserlz0%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o artifact.zip
          rm -rf artifact
          mkdir artifact
          unzip -q artifact.zip -d artifact
          EXE="$(find artifact -type f -name 'Horizonte_AFK.exe' -print -quit)"
          test -n "$EXE"
          cp "$EXE" Horizonte_AFK.exe
          SIZE=$(stat -c '%s' Horizonte_AFK.exe)
          SHA=$(sha256sum Horizonte_AFK.exe | awk '{print $1}')
          test "$SIZE" = '5834240'
          test "$SHA" = 'ff87f216efc933db84553c7d35aaf3c57fc1b91adcad8993a53fbf7f36df7275'
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "EXE SHA256=$SHA SIZE=$SIZE"
      - name: Criar release e atualizar manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='Corrige a falha persistente dos dialogs que ainda existia na v1.6.25. A causa real era uma disputa interna do RakSAMP: DialogUI_TryConsumeConsoleLine lia o stdin antes do parser de comandos e podia consumir !hzdialog como se fosse uma opção, senha ou texto do próprio diálogo. A v1.6.26 remove as respostas de dialog do stdin e usa IPC dedicado por arquivo com sequência, ID do diálogo e ACK explícito do núcleo. A UI nativa concorrente do RakSAMP não é mais aberta quando o launcher está controlando o diálogo. O stdin redirecionado continua preservado em código-fonte para chat/comandos. Também mantém as otimizações de polling da v1.6.25, além de contas, multi-servidor, Cloud 24/7 e updater.'
          if gh release view 'v1.6.26-beta.1' >/dev/null 2>&1; then
            gh release upload 'v1.6.26-beta.1' Horizonte_AFK.exe --clobber
          else
            gh release create 'v1.6.26-beta.1' Horizonte_AFK.exe --title 'Horizonte AFK v1.6.26-beta.1' --notes "$NOTES" --prerelease
          fi
          cat > latest.json <<EOF
          {
            "product": "Horizonte AFK",
            "channel": "beta",
            "version": "1.6.26-beta.1",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "available": true,
            "mandatory": false,
            "download_url": "https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.26-beta.1/Horizonte_AFK.exe",
            "sha256": "$SHA",
            "size_bytes": $SIZE,
            "encoding": "none",
            "notes": "Troca a resposta de dialogs para IPC dedicado por arquivo com ACK do núcleo, removendo a disputa com a UI/stdin nativos do RakSAMP. Mantém as otimizações de polling e os demais recursos.",
            "min_supported_version": "1.2.0"
          }
          EOF
          git config user.name 'Horizonte AFK Release CI'
          git config user.email 'actions@users.noreply.github.com'
          git add latest.json Horizonte_AFK.exe
          git commit -m 'release: v1.6.26-beta.1' || true
          git push
