name: Dev build v1.6.54 chat stability
on:
  push:
    branches: [dev/connection-chat-online-fix-v1.6.53]
    paths:
      - '.github/workflows/dev-inspect-v1652-chat-online.yml'
      - '.release-staging/v1.6.54/patch_chat_stability.py'
      - '.release-staging/v1.6.54/validate_chat_stability.ps1'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact v1.6.53 base
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.53-beta.1/Horizonte_AFK.exe' -OutFile base.exe
          $hash=(Get-FileHash base.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '91efd565c086c9ed7cd40b741e936a2a903e7b9b091e3b94054899020ae16c03'){throw "Unexpected base hash $hash"}
      - name: Patch candidate
        shell: pwsh
        run: python .release-staging/v1.6.54/patch_chat_stability.py base.exe Horizonte_AFK.exe
      - name: Validate runtime behavior
        shell: powershell
        run: ./.release-staging/v1.6.54/validate_chat_stability.ps1 -ExePath ./Horizonte_AFK.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Horizonte-AFK-v1.6.54-chat-stability-candidate
          path: Horizonte_AFK.exe
          if-no-files-found: error
