name: Publicar Horizonte AFK 1.6.45 beta1 direct
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.6.45-beta.1-direct.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar build validada
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-2264-820e-8a6e-4a1bb26f7f89/raw?se=2026-09-07T05%3A33%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=964ef47f-d59f-534f-9e65-f8af3e24710f&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T10%3A10%3A26Z&ske=2026-09-07T10%3A10%3A26Z&sks=b&skv=2026-02-06&sig=9DHrP8ALTmw0Q4jVc2yiNkxeaZ88/p97OyBXHI2k4jc%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o artifact.zip
          rm -rf artifact && mkdir artifact
          unzip -q artifact.zip -d artifact
          EXE="$(find artifact -type f -name 'Horizonte_AFK.exe' -print -quit)"
          test -n "$EXE"
          cp "$EXE" Horizonte_AFK.exe
          SIZE=$(stat -c '%s' Horizonte_AFK.exe)
          SHA=$(sha256sum Horizonte_AFK.exe | cut -d' ' -f1)
          test "$SIZE" = '5903360'
          test "$SHA" = '2e2572d05347715d4dcaa357ce7b098eab79678d4e8436a19855c7a350fb29df'
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
      - name: Publicar release e manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='Corrige o botão CONECTAR ESTA CONTA 24/7 da versão 1.6.44. Cada aba agora usa diretamente o fluxo Cloud estável que já faz validação, pareamento, criação da sessão e reparo de identidade. O botão mostra CONECTANDO imediatamente e, se a Discloud/API devolver qualquer erro, o motivo real aparece na tela em vez de parecer que o clique não funcionou. O produto continua 100% 24/7, sem modo local, e a aba CONEXÃO E CHAT continua seguindo a conta selecionada.'
          if gh release view 'v1.6.45-beta.1' >/dev/null 2>&1; then
            gh release upload 'v1.6.45-beta.1' Horizonte_AFK.exe --clobber
          else
            gh release create 'v1.6.45-beta.1' Horizonte_AFK.exe --title 'Horizonte AFK v1.6.45-beta.1' --notes "$NOTES" --prerelease
          fi
          cat > latest.json <<EOF
          {
            "product": "Horizonte AFK",
            "channel": "beta",
            "version": "1.6.45-beta.1",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "available": true,
            "mandatory": false,
            "download_url": "https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.45-beta.1/Horizonte_AFK.exe",
            "sha256": "$SHA",
            "size_bytes": $SIZE,
            "encoding": "none",
            "notes": "Corrige o clique de conectar 24/7 por pagina usando o fluxo Cloud estavel e exibindo o erro real quando a sessao nao puder ser criada.",
            "min_supported_version": "1.2.0"
          }
          EOF
          git config user.name 'Horizonte AFK Release CI'
          git config user.email 'actions@users.noreply.github.com'
          git add latest.json
          git commit -m 'release: v1.6.45-beta.1' || true
          git push
