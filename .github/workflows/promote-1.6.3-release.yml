name: Promover Horizonte AFK 1.6.3

on:
  push:
    paths:
      - '.release-v1.6.3'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-0650-820e-986c-b5371c183638/raw?se=2026-09-06T05%3A03%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=31f9ae92-1e9b-520d-8700-693c96c535a8&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T22%3A14%3A20Z&ske=2026-09-06T22%3A14%3A20Z&sks=b&skv=2026-02-06&sig=Yx8Y7qP6rky7xL20YAd90/5teGLq04lZKP0aR6xpwts%3D'
      ZIP_SHA256: 'c6e2246c22770f5ea817ffac01c5ef4ec8a55af157029f797eb906943ffaaa20'
      EXE_SHA256: '86a07adcc1508179a0ee134a34821dc3cd6591659d76cdf19e3c03ea98771e6f'
      EXE_SIZE: '2902016'
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e validar artefato privado
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 1 "$ARTIFACT_URL" -o /tmp/Horizonte-AFK-1.6.3.zip
          echo "$ZIP_SHA256  /tmp/Horizonte-AFK-1.6.3.zip" | sha256sum -c -
          rm -rf /tmp/hz163 && mkdir -p /tmp/hz163
          unzip -q /tmp/Horizonte-AFK-1.6.3.zip -d /tmp/hz163
          test -f /tmp/hz163/Horizonte_AFK.exe
          test "$(sha256sum /tmp/hz163/Horizonte_AFK.exe | awk '{print $1}')" = "$EXE_SHA256"
          test "$(stat -c%s /tmp/hz163/Horizonte_AFK.exe)" = "$EXE_SIZE"
          test "$(od -An -tx1 -N2 /tmp/hz163/Horizonte_AFK.exe | tr -d ' \n')" = "4d5a"
      - name: Promover EXE validado
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/hz163/Horizonte_AFK.exe ./Horizonte_AFK.exe
          printf '%s  Horizonte_AFK.exe\n' "$EXE_SHA256" > SHA256SUMS.txt
          git config user.name 'Horizonte AFK Release Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add Horizonte_AFK.exe SHA256SUMS.txt
          git commit -m 'Promove executável validado do Horizonte AFK 1.6.3'
          git push
