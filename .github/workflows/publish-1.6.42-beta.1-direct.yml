name: Publicar Horizonte AFK 1.6.42 beta1 direct
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.6.42-beta.1-direct.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar build validada
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-b3a8-820e-b27b-2f6e6e06342d/raw?se=2026-09-07T04%3A48%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=1f9cf6a5-f215-5924-8573-a8b6a0ae4d3b&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T12%3A50%3A25Z&ske=2026-09-07T12%3A50%3A25Z&sks=b&skv=2026-02-06&sig=Zq48YUncopcbqfsujwWLAyfO0Zt2a/RI%2Bn0GK5VZAf0%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o artifact.zip
          rm -rf artifact && mkdir artifact
          unzip -q artifact.zip -d artifact
          EXE="$(find artifact -type f -name 'Horizonte_AFK.exe' -print -quit)"
          test -n "$EXE"
          cp "$EXE" Horizonte_AFK.exe
          SIZE=$(stat -c '%s' Horizonte_AFK.exe)
          SHA=$(sha256sum Horizonte_AFK.exe | cut -d' ' -f1)
          test "$SIZE" = '5893632'
          test "$SHA" = 'cddd9391bd32c8811cd72410655e7899e4856f86f141699504743338b2288b9a'
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
      - name: Publicar release e manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='Nova arquitetura por paginas: cada pagina controla uma unica conta, com servidor, nick, processo RakSAMP, dialogs e desconexao independentes. O botao + NOVA CONTA cria outro contexto sem alterar as contas anteriores. O fluxo de spawn das paginas agora espera uma confirmacao real de classe do servidor antes de enviar RequestSpawn/Spawn, evitando marcar a conta como conectada apenas localmente.'
          if gh release view 'v1.6.42-beta.1' >/dev/null 2>&1; then
            gh release upload 'v1.6.42-beta.1' Horizonte_AFK.exe --clobber
          else
            gh release create 'v1.6.42-beta.1' Horizonte_AFK.exe --title 'Horizonte AFK v1.6.42-beta.1' --notes "$NOTES" --prerelease
          fi
          cat > latest.json <<EOF
          {
            "product": "Horizonte AFK",
            "channel": "beta",
            "version": "1.6.42-beta.1",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "available": true,
            "mandatory": false,
            "download_url": "https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.42-beta.1/Horizonte_AFK.exe",
            "sha256": "$SHA",
            "size_bytes": $SIZE,
            "encoding": "none",
            "notes": "Cada pagina agora controla uma conta independente, com servidor, nick, processo e dialogs proprios; o spawn espera confirmacao real do servidor.",
            "min_supported_version": "1.2.0"
          }
          EOF
          git config user.name 'Horizonte AFK Release CI'
          git config user.email 'actions@users.noreply.github.com'
          git add latest.json
          git commit -m 'release: v1.6.42-beta.1' || true
          git push
