name: Publicar Horizonte AFK 1.6.48 beta1 direct
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.6.48-beta.1-direct.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar build validada
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-b844-820e-83b0-cf01c2e9dd74/raw?se=2026-09-07T15%3A38%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=b6b78a8d-dc6e-5857-85ab-e6c3487ca6ad&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-07T15%3A31%3A51Z&ske=2026-09-08T15%3A31%3A51Z&sks=b&skv=2026-02-06&sig=UFxQ%2BOYtEI8T/ZpQnUiPKGfIrUENkSRmNWZsRr8Z6qU%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o artifact.zip
          rm -rf artifact && mkdir artifact
          unzip -q artifact.zip -d artifact
          EXE="$(find artifact -type f -name 'Horizonte_AFK.exe' -print -quit)"
          test -n "$EXE"
          cp "$EXE" Horizonte_AFK.exe
          SIZE=$(stat -c '%s' Horizonte_AFK.exe)
          SHA=$(sha256sum Horizonte_AFK.exe | cut -d' ' -f1)
          test "$SIZE" = '5908992'
          test "$SHA" = '6503925d26779557bc834e53bc96c886b6192e23ca54ef9eefb638ec9f4127b6'
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
      - name: Publicar release e manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='Proteção 24/7 contra ServerClosed e reinícios. No primeiro login manual, respostas reutilizáveis de dialogs (senha normal, escolhas de lista e spawn) são aprendidas por conta e sincronizadas com a Cloud. A Cloud v0.5.9 executa o replay em reconexões mesmo com o launcher/PC fechado. Respostas ficam criptografadas; conteúdo sensível não aparece em logs. Códigos OTP/2FA/captcha digitados, por serem temporários, continuam manuais. Há proteção contra repetição da mesma senha incorreta para evitar tentativas em loop.'
          if gh release view 'v1.6.48-beta.1' >/dev/null 2>&1; then
            gh release upload 'v1.6.48-beta.1' Horizonte_AFK.exe --clobber
            gh release edit 'v1.6.48-beta.1' --notes "$NOTES"
          else
            gh release create 'v1.6.48-beta.1' Horizonte_AFK.exe --title 'Horizonte AFK v1.6.48-beta.1' --notes "$NOTES" --prerelease
          fi
          cat > latest.json <<EOF
          {
            "product": "Horizonte AFK",
            "channel": "beta",
            "version": "1.6.48-beta.1",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "available": true,
            "mandatory": false,
            "download_url": "https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.48-beta.1/Horizonte_AFK.exe",
            "sha256": "$SHA",
            "size_bytes": $SIZE,
            "encoding": "none",
            "notes": "ServerClosed/restart autologin: dialog responses learned per account and replayed by Cloud v0.5.9 with encrypted persistence and retry-loop protection.",
            "min_supported_version": "1.2.0"
          }
          EOF
          git config user.name 'Horizonte AFK Release CI'
          git config user.email 'actions@users.noreply.github.com'
          git add latest.json
          git commit -m 'release: v1.6.48-beta.1' || true
          git push
