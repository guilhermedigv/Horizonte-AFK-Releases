name: Promover Horizonte AFK 1.6.11 beta1
on:
  push:
    branches: [publish-1.6.11-beta.1]
    paths:
      - '.github/workflows/promote-1.6.11-beta.1.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL_B64: ''
      VERSION: '1.6.11-beta.1'
      EXPECTED_SHA: '957f866334a4248ed8043aae63fffe2a048d632ae5bba72dd0f40d7e377607ab'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Baixar e validar build
        run: |
          ARTIFACT_URL="$(printf '%s' "$ARTIFACT_URL_B64" | base64 -d)"
          curl -fL --retry 3 "$ARTIFACT_URL" -o /tmp/hz-artifact.zip
          rm -rf /tmp/hz-artifact && mkdir -p /tmp/hz-artifact
          unzip -q /tmp/hz-artifact.zip -d /tmp/hz-artifact
          test -f "/tmp/hz-artifact/Horizonte_AFK_1.6.11-beta.1.exe"
          cp "/tmp/hz-artifact/Horizonte_AFK_1.6.11-beta.1.exe" /tmp/Horizonte_AFK.exe
          python3 - <<'PY'
          import hashlib,os,pathlib
          p=pathlib.Path('/tmp/Horizonte_AFK.exe'); d=p.read_bytes()
          assert d[:2]==b'MZ'
          assert hashlib.sha256(d).hexdigest()==os.environ['EXPECTED_SHA']
          pathlib.Path('/tmp/size.txt').write_text(str(len(d)))
          print('Build validada:',len(d),hashlib.sha256(d).hexdigest())
          PY
      - name: Preparar atualização oficial
        run: |
          git checkout main
          git pull --ff-only origin main
          cp /tmp/Horizonte_AFK.exe Horizonte_AFK.exe
          export EXPECTED_SIZE="$(cat /tmp/size.txt)"
          python3 - <<'PY'
          import json,os,datetime,pathlib
          root=pathlib.Path('.'); v=os.environ['VERSION']; sha=os.environ['EXPECTED_SHA']; size=int(os.environ['EXPECTED_SIZE'])
          now=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          url=f'https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v{v}/Horizonte_AFK.exe'
          changes=[
            'Removidos dos dialogs os códigos de cor do SA-MP, como {008BFF}, {FFFFFF} e {27AE60}, que estavam aparecendo como texto.',
            'Título, corpo, opções de lista e botões dos dialogs agora são exibidos limpos, sem marcadores de formatação do servidor.',
            'As respostas enviadas ao servidor continuam usando os valores originais, evitando quebrar login, spawn e seleções.',
            'Mantidas as correções do modo 24/7, Centro de Contas e multi-servidor das versões anteriores.'
          ]
          candidate={
            'product':'Horizonte AFK','channel':'beta','version':v,'published_at':now,'available':True,'mandatory':False,
            'download_url':url,'sha256':sha,'size_bytes':size,'encoding':'none',
            'notes':'Correção visual dos dialogs: códigos de cor/formatação do SA-MP não aparecem mais como texto.',
            'min_supported_version':'1.2.0'
          }
          root.joinpath('release-candidate.json').write_text(json.dumps(candidate,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          path=root/'release-changelog.json'; changelog=json.loads(path.read_text(encoding='utf-8-sig'))
          versions=[x for x in changelog.get('versions',[]) if x.get('version')!=v]
          versions.insert(0,{'version':v,'date':'2026-09-06','changes':changes})
          changelog['channel']='beta'; changelog['versions']=versions
          path.write_text(json.dumps(changelog,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          notes='# Horizonte AFK 1.6.11-beta.1\n\nCorreção visual dos dialogs do servidor.\n\n'+''.join(f'- {x}\n' for x in changes)+f'\nSHA-256: {sha}\n'
          root.joinpath('RELEASE_NOTES.md').write_text(notes,encoding='utf-8')
          root.joinpath('SHA256SUMS.txt').write_text(f'{sha}  Horizonte_AFK.exe\n',encoding='utf-8')
          PY
          git config user.name 'Horizonte AFK Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add Horizonte_AFK.exe release-candidate.json release-changelog.json RELEASE_NOTES.md SHA256SUMS.txt
          git commit -m 'release: Horizonte AFK 1.6.11-beta.1'
          git push origin main
