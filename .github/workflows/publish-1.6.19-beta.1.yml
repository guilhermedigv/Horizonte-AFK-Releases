name: Publicar Horizonte AFK 1.6.19 beta1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.6.19-beta.1.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar build validada
        env:
          ARTIFACT_URL: 'https://productionresultssa10.blob.core.windows.net/actions-results/40cc4ba4-688c-41f5-b7f4-1676096aacfa/workflow-job-run-d2e73583-7d8f-52ef-9ab7-01bb6c81dbc7/artifacts/886179e06fec8f09f2f780d25342d9bdfff3382b68cfbf2ea9aefd8cebfa10fa.zip?rscd=attachment%3B+filename%3D%22Horizonte-AFK-1.6.19-beta.1.zip%22&rsct=application%2Fzip&se=2026-09-06T19%3A08%3A48Z&sig=JLnIKpsPWKriOlybethxxY5HtMKsemed%2Bd9EvioRqak%3D&ske=2026-09-06T20%3A56%3A28Z&skoid=ca7593d4-ee42-46cd-af88-8b886a2f84eb&sks=b&skt=2026-09-06T16%3A56%3A28Z&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skv=2025-11-05&sp=r&spr=https&sr=b&st=2026-09-06T18%3A58%3A43Z&sv=2025-11-05'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o artifact.zip
          unzip -q artifact.zip -d artifact
          EXE="$(find artifact -type f -name 'Horizonte_AFK_1.6.19-beta.1.exe' -print -quit)"
          test -n "$EXE"
          cp "$EXE" Horizonte_AFK.exe
          SIZE=$(stat -c '%s' Horizonte_AFK.exe)
          SHA=$(sha256sum Horizonte_AFK.exe | awk '{print $1}')
          test "$SIZE" = '5809152'
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "EXE=$EXE" >> "$GITHUB_ENV"
          echo "EXE SHA256=$SHA SIZE=$SIZE"
      - name: Criar release e atualizar manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view 'v1.6.19-beta.1' >/dev/null 2>&1; then
            gh release upload 'v1.6.19-beta.1' Horizonte_AFK.exe --clobber
          else
            gh release create 'v1.6.19-beta.1' Horizonte_AFK.exe --title 'Horizonte AFK v1.6.19-beta.1' --notes 'Registro persistente por dispositivo. O MachineGuid do Windows é usado somente para gerar localmente um hash SHA-256 opaco; o valor bruto não é salvo nem enviado. Perfis Cloud ficam registrados após fechar/reabrir o launcher e continuam com atualização em tempo real. Esta migração também encerra uma única vez as sessões 24/7 antigas visíveis ao cliente, conforme solicitado.' --prerelease
          fi
          cat > latest.json <<EOF
          {
            "product": "Horizonte AFK",
            "channel": "beta",
            "version": "1.6.19-beta.1",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "available": true,
            "mandatory": false,
            "download_url": "https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.19-beta.1/Horizonte_AFK.exe",
            "sha256": "$SHA",
            "size_bytes": $SIZE,
            "encoding": "none",
            "notes": "Registro persistente por dispositivo + Centro de Contas durável. Sessões 24/7 antigas visíveis são encerradas uma vez na migração.",
            "min_supported_version": "1.2.0"
          }
          EOF
          git config user.name 'Horizonte AFK Release CI'
          git config user.email 'actions@users.noreply.github.com'
          git add latest.json Horizonte_AFK.exe
          git commit -m 'release: v1.6.19-beta.1' || true
          git push
