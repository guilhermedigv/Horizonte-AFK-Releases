name: Promover Horizonte AFK 1.6.6-beta.3

on:
  push:
    branches: [main]
    paths:
      - '.release-v1.6.6-beta.3'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-3d40-820e-9c78-89c38e9a94a4/raw?se=2026-09-06T07%3A53%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=d4657b07-a055-5ec0-8142-7cd14d93aed9&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T22%3A13%3A31Z&ske=2026-09-06T22%3A13%3A31Z&sks=b&skv=2026-02-06&sig=xKQp8gIAthpeV2sEfcNucn0gurTmkBItjsxKM%2BRZroU%3D'
      ZIP_SHA256: '040da8e802a5abf5d07e71ca3d8380bb7ed14fc9e3f8e8807eb91b3effade577'
      EXPECTED_EXE_SHA256: '04c614d20aacd07ed9e4cff4aeb07acfab3ce8339bb3fa4d7a58932a99453ce5'
      EXPECTED_EXE_SIZE: '2928128'
    steps:
      - uses: actions/checkout@v4

      - name: Baixar e validar artefato testado
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 1 "$ARTIFACT_URL" -o /tmp/Horizonte-AFK-1.6.6-beta.3.zip
          echo "$ZIP_SHA256  /tmp/Horizonte-AFK-1.6.6-beta.3.zip" | sha256sum -c -
          rm -rf /tmp/hz166b3 && mkdir -p /tmp/hz166b3
          unzip -q /tmp/Horizonte-AFK-1.6.6-beta.3.zip -d /tmp/hz166b3
          test -f /tmp/hz166b3/Horizonte_AFK.exe
          test "$(od -An -tx1 -N2 /tmp/hz166b3/Horizonte_AFK.exe | tr -d ' \n')" = "4d5a"
          SIZE="$(stat -c%s /tmp/hz166b3/Horizonte_AFK.exe)"
          SHA="$(sha256sum /tmp/hz166b3/Horizonte_AFK.exe | awk '{print $1}')"
          test "$SIZE" = "$EXPECTED_EXE_SIZE"
          test "$SHA" = "$EXPECTED_EXE_SHA256"
          echo "EXE_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "EXE_SHA256=$SHA" >> "$GITHUB_ENV"

      - name: Preparar candidato v1.6.6-beta.3
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/hz166b3/Horizonte_AFK.exe ./Horizonte_AFK.exe
          printf '%s  Horizonte_AFK.exe\n' "$EXE_SHA256" > SHA256SUMS.txt
          python3 - <<'PY'
          import json, os
          meta={
            'product':'Horizonte AFK',
            'channel':'beta',
            'version':'1.6.6-beta.3',
            'published_at':'2026-09-06T07:50:00.000Z',
            'available':True,
            'mandatory':False,
            'download_url':'https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.6-beta.3/Horizonte_AFK.exe',
            'sha256':os.environ['EXE_SHA256'],
            'size_bytes':int(os.environ['EXE_SIZE']),
            'encoding':'none',
            'notes':'Corrige o fluxo inicial do modo 24/7 para impedir spawn automático antes do login/2FA e permitir observar os dialogs do servidor com segurança.',
            'min_supported_version':'1.2.0'
          }
          open('release-candidate.json','w',encoding='utf-8').write(json.dumps(meta,ensure_ascii=False,indent=2)+'\n')
          p='release-changelog.json'
          try:
              d=json.load(open(p,encoding='utf-8-sig'))
          except Exception:
              d={'channel':'beta','versions':[]}
          d['channel']='beta'
          d['versions']=[v for v in d.get('versions',[]) if v.get('version')!='1.6.6-beta.3']
          d['versions'].insert(0,{
            'version':'1.6.6-beta.3','date':'2026-09-06','changes':[
              'Modo 24/7 não tenta mais spawnar imediatamente ao conectar.',
              'O RakSAMP Cloud permanece conectado processando RPCs/scripts para que login, 2FA e outros dialogs apareçam primeiro no EXE.',
              'Mantém o chat/console puro da nuvem e o diagnóstico de IP da beta anterior.',
              'Mantém o fail-safe: uma falha na camada Cloud não impede o modo local de abrir.'
            ]})
          open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          cat > RELEASE_NOTES.md <<EOF
          # Horizonte AFK 1.6.6-beta.3

          Correção do fluxo inicial do modo Cloud 24/7.

          - Impede o RakSAMP da Discloud de tentar spawnar antes do login/2FA.
          - Mantém o processamento dos scripts/RPCs para que os dialogs reais do servidor sejam exibidos no próprio Horizonte AFK.
          - Mantém o console/chat puro da nuvem e o diagnóstico de IP.
          - Mantém o modo local e o fail-safe intactos.

          Esta é uma beta de validação do handshake: primeiro confirme que os dialogs de login/2FA aparecem sem o servidor bloquear a conexão. A finalização automática do spawn será ajustada depois de validar a sequência real do servidor.

          SHA-256: `$EXE_SHA256`
          EOF

      - name: Promover somente após validações
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Horizonte AFK Release Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add Horizonte_AFK.exe SHA256SUMS.txt release-candidate.json release-changelog.json RELEASE_NOTES.md
          git commit -m 'Promove Horizonte AFK v1.6.6-beta.3 validado'
          git push
