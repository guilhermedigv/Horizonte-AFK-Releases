name: Promover Horizonte AFK 1.6.6-beta.1

on:
  push:
    branches: [main]
    paths:
      - '.release-v1.6.6-beta.1'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-42c4-820e-92be-9dda142af2cb/raw?se=2026-09-06T07%3A15%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=e35beca8-ec31-5e49-8cd2-6d03bb55b20f&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T22%3A14%3A20Z&ske=2026-09-06T22%3A14%3A20Z&sks=b&skv=2026-02-06&sig=PXhKIN1/LnXwoJJrC/HzRcXqoxYdB2h%2ByC4gdmBHGic%3D'
      ZIP_SHA256: 'fd745434b31d43f3d4b2df080910bd19794c6f5857031b2914dd481db90e6f54'
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e validar artefato testado
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 1 "$ARTIFACT_URL" -o /tmp/Horizonte-AFK-1.6.6-beta.1.zip
          echo "$ZIP_SHA256  /tmp/Horizonte-AFK-1.6.6-beta.1.zip" | sha256sum -c -
          rm -rf /tmp/hz166 && mkdir -p /tmp/hz166
          unzip -q /tmp/Horizonte-AFK-1.6.6-beta.1.zip -d /tmp/hz166
          test -f /tmp/hz166/Horizonte_AFK.exe
          test "$(od -An -tx1 -N2 /tmp/hz166/Horizonte_AFK.exe | tr -d ' \n')" = "4d5a"
          SIZE="$(stat -c%s /tmp/hz166/Horizonte_AFK.exe)"
          test "$SIZE" -gt 2000000
          test "$SIZE" -lt 5000000
          SHA="$(sha256sum /tmp/hz166/Horizonte_AFK.exe | awk '{print $1}')"
          echo "EXE_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "EXE_SHA256=$SHA" >> "$GITHUB_ENV"
      - name: Preparar candidato v1.6.6-beta.1
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/hz166/Horizonte_AFK.exe ./Horizonte_AFK.exe
          printf '%s  Horizonte_AFK.exe\n' "$EXE_SHA256" > SHA256SUMS.txt
          python3 - <<'PY'
          import json, os
          meta={
            'product':'Horizonte AFK',
            'channel':'beta',
            'version':'1.6.6-beta.1',
            'published_at':'2026-09-06T07:12:00.000Z',
            'available':True,
            'mandatory':False,
            'download_url':'https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.6-beta.1/Horizonte_AFK.exe',
            'sha256':os.environ['EXE_SHA256'],
            'size_bytes':int(os.environ['EXE_SIZE']),
            'encoding':'none',
            'notes':'Reintroduz o modo 24/7 direto no EXE com correção da falha de abertura, teste real de inicialização WPF e fallback seguro para o modo local.',
            'min_supported_version':'1.2.0'
          }
          open('release-candidate.json','w',encoding='utf-8').write(json.dumps(meta,ensure_ascii=False,indent=2)+'\n')
          p='release-changelog.json'
          d=json.load(open(p,encoding='utf-8-sig'))
          d['channel']='beta'
          d['versions']=[v for v in d.get('versions',[]) if v.get('version')!='1.6.6-beta.1']
          d['versions'].insert(0,{
            'version':'1.6.6-beta.1','date':'2026-09-06','changes':[
              'Modo 24/7 voltou diretamente dentro do Horizonte AFK, sem abrir painel no navegador.',
              'Corrigida a falha de sintaxe que podia fazer a beta anterior iniciar sem exibir a interface.',
              'Adicionado teste que analisa e carrega o painel WPF final antes de permitir a publicação.',
              'Adicionado fail-safe: se a camada Cloud não puder ser aplicada, o launcher mantém o modo local funcional.',
              'Login, 2FA e dialogs da sessão Cloud continuam sendo exibidos no próprio EXE.'
            ]})
          open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          cat > RELEASE_NOTES.md <<EOF
          # Horizonte AFK 1.6.6-beta.1

          Reintrodução segura do modo Cloud 24/7.

          - O botão 24/7 funciona dentro do próprio Horizonte AFK, sem redirecionar para navegador.
          - A sessão RakSAMP é criada na Discloud; login, 2FA e dialogs são respondidos pelo EXE.
          - Corrige a regressão da beta anterior que podia iniciar sem mostrar nenhuma janela.
          - O script PowerShell/WPF final agora é analisado e carregado em teste real antes da build ser aceita.
          - Foi adicionado fallback seguro: uma falha na integração Cloud não impede o modo local de abrir.
          - O backend Discloud precisa estar na versão 0.4.0 com direct_client=true para ativar o modo direto.

          SHA-256: `$EXE_SHA256`
          EOF
      - name: Promover somente após validações
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Horizonte AFK Release Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add Horizonte_AFK.exe SHA256SUMS.txt release-candidate.json release-changelog.json RELEASE_NOTES.md
          git commit -m 'Promove Horizonte AFK v1.6.6-beta.1 validado'
          git push
