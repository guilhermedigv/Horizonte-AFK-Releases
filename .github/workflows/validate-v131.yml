name: Validar fonte 1.3.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-v131.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar pacote antigo
        shell: bash
        run: |
          set -euo pipefail
          cat build/v1.3.1/source-parts/part-*.b64 | base64 -d > /tmp/source.tgz
          tar -tzf /tmp/source.tgz >/tmp/list.txt
          echo 'VALID' > build/v1.3.1/VALIDATED
          git config user.name 'Horizonte AFK Updater'
          git config user.email 'actions@users.noreply.github.com'
          git add build/v1.3.1/VALIDATED
          git commit -m 'Valida pacote fonte 1.3.1'
          git push
