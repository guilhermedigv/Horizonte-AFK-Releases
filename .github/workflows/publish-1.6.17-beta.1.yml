name: Publicar Horizonte AFK 1.6.17 beta1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.6.17-beta.1.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar build validada
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://productionresultssa10.blob.core.windows.net/actions-results/006b71ec-008c-4a52-8b82-f6a7f36ab4a1/workflow-job-run-fa2c185a-26a6-5fde-b61c-90b5d9a99eb8/artifacts/b48260f1c0eef9f2d8e0d5547db450aacbe4d2253468a644dc79835ae8445dbb.zip?rscd=attachment%3B+filename%3D%22Horizonte-AFK-1.6.17-beta.1.zip%22&rsct=application%2Fzip&se=2026-09-06T18%3A34%3A47Z&sig=TLijoksKt8ZxRD5naoQLGmTVBQ%2Bat6T9DU9GAGOGLZ0%3D&ske=2026-09-06T20%3A57%3A04Z&skoid=ca7593d4-ee42-46cd-af88-8b886a2f84eb&sks=b&skt=2026-09-06T16%3A57%3A04Z&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skv=2025-11-05&sp=r&spr=https&sr=b&st=2026-09-06T18%3A24%3A42Z&sv=2025-11-05' -o build.zip
          unzip -j build.zip 'Horizonte_AFK_1.6.17-beta.1.exe' -d out
          mv out/Horizonte_AFK_1.6.17-beta.1.exe Horizonte_AFK.exe
          echo '0f7c0120650c6ae4c96b4a10d1bb41080e0c648ed6efeb284ad73a31a10ae578  Horizonte_AFK.exe' | sha256sum -c -
          test "$(stat -c %s Horizonte_AFK.exe)" = '5796864'
      - name: Criar release e atualizar manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v1.6.17-beta.1'
          NOTES='Correção do erro Não foi possível preparar a conexão após a atualização: o launcher usa um diretório de runtime novo para não colidir com RakSAMPClient.exe/lua51.dll ainda travados pela versão anterior. Mantém nick estrito e chat 24/7 separado.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Horizonte_AFK.exe --clobber
          else
            gh release create "$TAG" Horizonte_AFK.exe --title 'Horizonte AFK 1.6.17-beta.1' --notes "$NOTES" --prerelease
          fi
          python3 - <<'PY'
          import json, datetime
          p='latest.json'
          with open(p,'r',encoding='utf-8') as f: d=json.load(f)
          d.update({
            'product':'Horizonte AFK',
            'channel':'beta',
            'version':'1.6.17-beta.1',
            'published_at':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),
            'available':True,
            'mandatory':False,
            'download_url':'https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.17-beta.1/Horizonte_AFK.exe',
            'sha256':'0f7c0120650c6ae4c96b4a10d1bb41080e0c648ed6efeb284ad73a31a10ae578',
            'size_bytes':5796864,
            'encoding':'none',
            'notes':'Correção do runtime travado após update: a 1.6.17 usa runtime isolado novo. Mantém nick estrito e chat 24/7 separado.',
            'min_supported_version':'1.2.0'
          })
          d.pop('parts',None); d.pop('part_encoding',None)
          with open(p,'w',encoding='utf-8') as f: json.dump(d,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json
          git commit -m 'release: apontar updater para 1.6.17-beta.1'
          git push
