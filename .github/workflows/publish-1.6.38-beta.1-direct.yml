name: Publicar Horizonte AFK 1.6.38 beta1 direct
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.6.38-beta.1-direct.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar build validada
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-a0fc-820e-b108-2aeb3734cf78/raw?se=2026-09-07T02%3A55%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=54e19044-30f6-535f-808f-31d9cd336265&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T21%3A31%3A26Z&ske=2026-09-07T21%3A31%3A26Z&sks=b&skv=2026-02-06&sig=bax263HRUy/yGwc89ri/Hhpz1V5OcCiedesIdf9ArbM%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o artifact.zip
          rm -rf artifact && mkdir artifact
          unzip -q artifact.zip -d artifact
          EXE="$(find artifact -type f -name 'Horizonte_AFK.exe' -print -quit)"
          test -n "$EXE"
          cp "$EXE" Horizonte_AFK.exe
          SIZE=$(stat -c '%s' Horizonte_AFK.exe)
          SHA=$(sha256sum Horizonte_AFK.exe | cut -d' ' -f1)
          test "$SIZE" = '5872640'
          test "$SHA" = '8ae1088a4b307d192461a8bf6f4c6f5e8b229cd76efa8fd3614201e1caee8860'
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
      - name: Publicar release e manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='Corrige o bloqueio da interface com uma sessao 24/7 ativa: servidor, nick e botao principal continuam disponiveis para adicionar contas locais sem derrubar a nuvem. A primeira conta local com Cloud ativo nasce como sessao independente e todas as contas locais ficam gerenciaveis pela aba Contas.'
          if gh release view 'v1.6.38-beta.1' >/dev/null 2>&1; then
            gh release upload 'v1.6.38-beta.1' Horizonte_AFK.exe --clobber
          else
            gh release create 'v1.6.38-beta.1' Horizonte_AFK.exe --title 'Horizonte AFK v1.6.38-beta.1' --notes "$NOTES" --prerelease
          fi
          cat > latest.json <<EOF
          {
            "product": "Horizonte AFK",
            "channel": "beta",
            "version": "1.6.38-beta.1",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "available": true,
            "mandatory": false,
            "download_url": "https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.38-beta.1/Horizonte_AFK.exe",
            "sha256": "$SHA",
            "size_bytes": $SIZE,
            "encoding": "none",
            "notes": "Sessao 24/7 ativa nao bloqueia mais servidor, nick e conexao local aditiva; novas contas ficam independentes e gerenciaveis em Contas.",
            "min_supported_version": "1.2.0"
          }
          EOF
          git config user.name 'Horizonte AFK Release CI'
          git config user.email 'actions@users.noreply.github.com'
          git add latest.json
          git commit -m 'release: v1.6.38-beta.1' || true
          git push
