name: Promover Horizonte AFK 1.6.6-beta.2

on:
  push:
    branches: [main]
    paths:
      - '.release-v1.6.6-beta.2'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-eecc-820e-a3bd-6764f875194a/raw?se=2026-09-06T07%3A38%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=4f560ce2-5221-5be4-98a2-cad8f3fae4c1&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T22%3A14%3A20Z&ske=2026-09-06T22%3A14%3A20Z&sks=b&skv=2026-02-06&sig=7MRg87CqqoIb2B9IOcRqTFoapVgO1D%2BhX%2BdnXkrYGCI%3D'
      ZIP_SHA256: 'c15473d718bcdcae9cbf88b48f191e856d6f24f3f060bb61835947c9ad216620'
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e validar artefato testado
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 1 "$ARTIFACT_URL" -o /tmp/Horizonte-AFK-1.6.6-beta.2.zip
          echo "$ZIP_SHA256  /tmp/Horizonte-AFK-1.6.6-beta.2.zip" | sha256sum -c -
          rm -rf /tmp/hz166b2 && mkdir -p /tmp/hz166b2
          unzip -q /tmp/Horizonte-AFK-1.6.6-beta.2.zip -d /tmp/hz166b2
          test -f /tmp/hz166b2/Horizonte_AFK.exe
          test "$(od -An -tx1 -N2 /tmp/hz166b2/Horizonte_AFK.exe | tr -d ' \n')" = "4d5a"
          SIZE="$(stat -c%s /tmp/hz166b2/Horizonte_AFK.exe)"
          test "$SIZE" -gt 2000000
          test "$SIZE" -lt 5000000
          SHA="$(sha256sum /tmp/hz166b2/Horizonte_AFK.exe | awk '{print $1}')"
          echo "EXE_SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "EXE_SHA256=$SHA" >> "$GITHUB_ENV"
      - name: Preparar candidato v1.6.6-beta.2
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/hz166b2/Horizonte_AFK.exe ./Horizonte_AFK.exe
          printf '%s  Horizonte_AFK.exe\n' "$EXE_SHA256" > SHA256SUMS.txt
          python3 - <<'PY'
          import json, os
          meta={
            'product':'Horizonte AFK',
            'channel':'beta',
            'version':'1.6.6-beta.2',
            'published_at':'2026-09-06T07:34:00.000Z',
            'available':True,
            'mandatory':False,
            'download_url':'https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.6-beta.2/Horizonte_AFK.exe',
            'sha256':os.environ['EXE_SHA256'],
            'size_bytes':int(os.environ['EXE_SIZE']),
            'encoding':'none',
            'notes':'Adiciona chat/console puro da sessão Cloud e diagnóstico do IP público estimado da Discloud, mantendo fail-safe do modo local.',
            'min_supported_version':'1.2.0'
          }
          open('release-candidate.json','w',encoding='utf-8').write(json.dumps(meta,ensure_ascii=False,indent=2)+'\n')
          p='release-changelog.json'
          d=json.load(open(p,encoding='utf-8-sig'))
          d['channel']='beta'
          d['versions']=[v for v in d.get('versions',[]) if v.get('version')!='1.6.6-beta.2']
          d['versions'].insert(0,{
            'version':'1.6.6-beta.2','date':'2026-09-06','changes':[
              'A área de log passa a mostrar a saída real do RakSAMP na Discloud, incluindo mensagens [CMSG] e eventos de conexão.',
              'Adicionado diagnóstico do IP público estimado da nuvem quando o backend 0.4.1 estiver instalado.',
              'Corrigida a versão interna do updater para corresponder à versão publicada e evitar atualização repetida.',
              'A camada de diagnóstico possui fail-safe e não impede o modo local ou a interface de abrirem se algo falhar.'
            ]})
          open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          cat > RELEASE_NOTES.md <<EOF
          # Horizonte AFK 1.6.6-beta.2

          Diagnóstico melhorado do modo Cloud 24/7.

          - O painel de log do EXE mostra o console/chat real do RakSAMP executado na Discloud.
          - Mensagens do servidor, [CMSG], conexão, spawn, fechamento e bloqueios ficam visíveis para diagnóstico.
          - Com o backend Cloud 0.4.1, o EXE também mostra o IP público estimado da saída HTTP da Discloud.
          - O IP é apenas uma estimativa de egress; para whitelist definitiva, confirme o IP visto pelo próprio servidor SA-MP.
          - A versão interna do updater agora é 1.6.6-beta.2, alinhada à release.
          - O fail-safe continua ativo: falha na camada de diagnóstico não deve quebrar o modo local nem impedir a janela de abrir.

          SHA-256: `$EXE_SHA256`
          EOF
      - name: Promover somente após validações
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Horizonte AFK Release Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add Horizonte_AFK.exe SHA256SUMS.txt release-candidate.json release-changelog.json RELEASE_NOTES.md
          git commit -m 'Promove Horizonte AFK v1.6.6-beta.2 validado'
          git push
