name: Diagnose v1.6.55 auto updater
on:
  push:
    branches: [diag/v1655-auto-updater]
    paths:
      - '.github/workflows/diag-v1655-auto-updater.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact public v1.6.55
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force diag-out | Out-Null
          gh release download v1.6.55-beta.1 --pattern Horizonte_AFK.exe --dir diag-out
          $p='diag-out/Horizonte_AFK.exe'
          $sha=(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
          $size=(Get-Item $p).Length
          Write-Host "v1655_size=$size"
          Write-Host "v1655_sha=$sha"
          if($sha-ne'0079d132ca1963e1073c8914f4e321fe65f0894ae6a4875ab88db8cbf7dc941c'){throw 'Unexpected v1.6.55 asset hash'}
      - name: Extract updater strings from exact EXE
        shell: python
        run: |
          import re
          p=r'diag-out/Horizonte_AFK.exe'
          data=open(p,'rb').read()
          print('manifest_present=', b'https://raw.githubusercontent.com/guilhermedigv/Horizonte-AFK-Releases/main/latest.json' in data)
          toks=[]
          for m in re.finditer(rb'1\.6\.\d+(?:-beta\.1)?',data):
              t=m.group().decode()
              if t not in toks: toks.append(t)
          print('version_tokens=', toks)
          for needle in [b'HZ_LAUNCHER_VERSION=1.6.55-beta.1', b'$manifestUrl=%s', b'$currentVersion=%s']:
              print(needle.decode(errors='replace'), needle in data)
      - name: Probe PowerShell 5.1 JSON parsing
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $urls=[ordered]@{
            main='https://raw.githubusercontent.com/guilhermedigv/Horizonte-AFK-Releases/main/latest.json'
            noBom='https://raw.githubusercontent.com/guilhermedigv/Horizonte-AFK-Releases/diag/v1655-auto-updater/diag/manifest-no-bom.json'
            withBom='https://raw.githubusercontent.com/guilhermedigv/Horizonte-AFK-Releases/diag/v1655-auto-updater/diag/manifest-with-bom.json'
          }
          foreach($name in $urls.Keys){
            $url=$urls[$name]+'?t='+[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
            $w=Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 10 -Headers @{'Cache-Control'='no-cache';'User-Agent'='Horizonte-AFK/1.6.55-beta.1'}
            $ct=[string]$w.Headers['Content-Type']
            $raw=[string]$w.Content
            $first=$(if($raw.Length){[int][char]$raw[0]}else{-1})
            Write-Host "$name contentType=$ct firstChar=$first rawPrefix=$($raw.Substring(0,[Math]::Min(20,$raw.Length)).Replace("`r",'').Replace("`n",''))"
            $m=Invoke-RestMethod -Uri $url -UseBasicParsing -TimeoutSec 10 -Headers @{'Cache-Control'='no-cache';'User-Agent'='Horizonte-AFK/1.6.55-beta.1'}
            $type=$(if($null-eq$m){'<null>'}else{$m.GetType().FullName})
            Write-Host "$name restType=$type version=$([string]$m.version) available=$([string]$m.available)"
          }
      - name: Verify no-BOM manifest parses like updater expects
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $u='https://raw.githubusercontent.com/guilhermedigv/Horizonte-AFK-Releases/diag/v1655-auto-updater/diag/manifest-no-bom.json'
          $m=Invoke-RestMethod -Uri ($u+'?t='+[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()) -UseBasicParsing -TimeoutSec 7 -Headers @{'Cache-Control'='no-cache';'User-Agent'='Horizonte-AFK/1.6.55-beta.1'}
          if([string]$m.version-ne'1.6.58-beta.1'){throw "No-BOM did not parse; type=$($m.GetType().FullName)"}
          if(-not $m.available){throw 'No-BOM available false'}
          Write-Host 'NO_BOM_PARSE_OK'
