name: Publicar Horizonte AFK

on:
  push:
    branches: [main]
    paths:
      - "Horizonte_AFK.exe"
      - "Horizonte_AFK_UPDATE_*.exe"
      - "build/v*/READY"
      - ".github/workflows/publish-launcher.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar ou compilar executável
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_BUNDLE="$(find build -type f -path '*/source.tgz.b64' -print 2>/dev/null | sort -V | tail -n 1 || true)"
          SOURCE_PART="$(find build -type f -path '*/source-part-*.b64' -print 2>/dev/null | sort -V | tail -n 1 || true)"
          CANDIDATE="$(find . -maxdepth 1 -type f -name 'Horizonte_AFK_UPDATE_*.exe' -print -quit || true)"

          if [ -n "$SOURCE_BUNDLE" ] || [ -n "$SOURCE_PART" ]; then
            rm -rf .build-hz
            mkdir -p .build-hz
            if [ -n "$SOURCE_BUNDLE" ]; then
              echo "Compilando a partir de $SOURCE_BUNDLE"
              base64 -d "$SOURCE_BUNDLE" > .build-hz/source.tgz
            else
              SOURCE_DIR="$(dirname "$SOURCE_PART")"
              echo "Compilando a partir das partes em $SOURCE_DIR"
              cat "$SOURCE_DIR"/source-part-*.b64 | base64 -d > .build-hz/source.tgz
            fi
            tar -xzf .build-hz/source.tgz -C .build-hz
            cd .build-hz
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -H=windowsgui" -o ../Horizonte_AFK.exe .
            cd ..
          elif [ -n "$CANDIDATE" ]; then
            cp -f "${CANDIDATE#./}" Horizonte_AFK.exe
          fi

          test -f Horizonte_AFK.exe
          test "$(head -c 2 Horizonte_AFK.exe)" = "MZ"

      - name: Validar executável e ativar manifesto
        shell: bash
        run: |
          set -euo pipefail
          HASH="$(sha256sum Horizonte_AFK.exe | awk '{print $1}')"
          SIZE="$(stat -c%s Horizonte_AFK.exe)"
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          python3 - "$HASH" "$SIZE" "$NOW" <<'PY'
          import json, sys
          from pathlib import Path

          sha256, size, now = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          p = Path('latest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['available'] = True
          data['published_at'] = now
          data['download_url'] = 'https://raw.githubusercontent.com/guilhermedigv/Horizonte-AFK-Releases/main/Horizonte_AFK.exe'
          data['sha256'] = sha256
          data['size_bytes'] = size
          data['encoding'] = 'none'
          data.pop('parts', None)
          data.pop('part_encoding', None)
          data['notes'] = 'Versão estável publicada automaticamente. O mesmo Horizonte_AFK.exe é atualizado e reiniciado com validação SHA-256.'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commitar executável e manifesto
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Horizonte AFK Updater"
          git config user.email "actions@users.noreply.github.com"
          git add Horizonte_AFK.exe latest.json
          for f in Horizonte_AFK_UPDATE_*.exe; do
            [ -e "$f" ] || continue
            git rm -f "$f"
          done
          if git diff --cached --quiet; then
            exit 0
          fi
          VERSION="$(python3 -c "import json; print(json.load(open('latest.json'))['version'])")"
          git commit -m "Publica atualização automática $VERSION"
          git push
