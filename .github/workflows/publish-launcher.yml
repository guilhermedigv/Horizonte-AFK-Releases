name: Publicar Horizonte AFK
on:
  push:
    branches: [main]
    paths:
      - 'Horizonte_AFK.exe'
      - 'release-candidate.json'
      - 'scripts/publish-release.py'
      - '.github/workflows/publish-launcher.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: horizonte-stable-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar e conferir o executável oficial
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py
      - name: Confirmar download público sem credenciais
        run: |
          python3 - <<'PY'
          import hashlib,json,time,urllib.request
          m=json.load(open('release-candidate.json'))
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(m['download_url'],timeout=60) as r: data=r.read()
                  assert len(data)==m['size_bytes']
                  assert hashlib.sha256(data).hexdigest()==m['sha256']
                  break
              except Exception:
                  if attempt==5: raise
                  time.sleep(5)
          PY
      - name: Ativar canal estável após verificar a release
        run: |
          cp release-candidate.json latest.json
          cp release-changelog.json changelog.json
          git config user.name 'Horizonte AFK Updater'
          git config user.email 'actions@users.noreply.github.com'
          git add latest.json changelog.json
          if ! git diff --cached --quiet; then
            git commit -m 'Ativa Horizonte AFK 1.4.0 após verificar download oficial'
            git push
          fi
