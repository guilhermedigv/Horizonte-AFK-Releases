name: Publicar Horizonte AFK

on:
  push:
    branches: [main]
    paths:
      - "Horizonte_AFK.exe"
      - "Horizonte_AFK_UPDATE_*.exe"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar executável publicado
        shell: bash
        run: |
          set -euo pipefail
          SRC="Horizonte_AFK.exe"
          CANDIDATE="$(find . -maxdepth 1 -type f -name 'Horizonte_AFK_UPDATE_*.exe' -print -quit || true)"
          if [ -n "$CANDIDATE" ]; then
            SRC="${CANDIDATE#./}"
            cp -f "$SRC" Horizonte_AFK.exe
          fi
          test -f Horizonte_AFK.exe
          test "$(head -c 2 Horizonte_AFK.exe)" = "MZ"

      - name: Validar executável e ativar manifesto
        shell: bash
        run: |
          set -euo pipefail
          HASH="$(sha256sum Horizonte_AFK.exe | awk '{print $1}')"
          SIZE="$(stat -c%s Horizonte_AFK.exe)"
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          python3 - "$HASH" "$SIZE" "$NOW" <<'PY'
          import json, sys
          from pathlib import Path

          sha256, size, now = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          p = Path('latest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['available'] = True
          data['published_at'] = now
          data['download_url'] = 'https://raw.githubusercontent.com/guilhermedigv/Horizonte-AFK-Releases/main/Horizonte_AFK.exe'
          data['sha256'] = sha256
          data['size_bytes'] = size
          data['encoding'] = 'none'
          data.pop('parts', None)
          data.pop('part_encoding', None)
          data['notes'] = 'Build de teste publicada para validar o auto-update do Horizonte AFK.'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commitar executável e manifesto
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Horizonte AFK Updater"
          git config user.email "actions@users.noreply.github.com"
          git add Horizonte_AFK.exe latest.json
          for f in Horizonte_AFK_UPDATE_*.exe; do
            [ -e "$f" ] || continue
            git rm -f "$f"
          done
          if git diff --cached --quiet; then
            exit 0
          fi
          VERSION="$(python3 -c "import json; print(json.load(open('latest.json'))['version'])")"
          git commit -m "Publica atualização automática $VERSION"
          git push
