name: Diagnosticar fonte Horizonte AFK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-launcher.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Testar pacotes candidatos sem publicar
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .diag-hz
          mkdir -p .diag-hz

          python3 <<'PY'
          import base64, gzip, io, pathlib, tarfile

          root = pathlib.Path('build/v1.4.0')
          candidates = [
              ('oficial-zz-small', [
                  root/'zz-small/source-part-00.b64',
                  root/'zz-small/source-part-01.b64',
                  root/'zz-small/source-part-02.b64',
                  root/'zz-small/source-part-03.b64',
                  root/'zz-small/source-part-04.b64',
              ]),
              ('raiz-00-02', [
                  root/'source-part-00.b64',
                  root/'source-part-01.b64',
                  root/'source-part-02.b64',
              ]),
              ('z-normal-atual', [
                  root/'z-normal/source-part-00.b64',
                  root/'z-normal/source-part-01.b64',
                  root/'z-normal/source-part-03.b64',
                  root/'z-normal/source-part-04.b64',
              ]),
              ('misto-raiz00-02-z03-04', [
                  root/'source-part-00.b64',
                  root/'source-part-01.b64',
                  root/'source-part-02.b64',
                  root/'z-normal/source-part-03.b64',
                  root/'z-normal/source-part-04.b64',
              ]),
              ('misto-z00-01-raiz02-z03-04', [
                  root/'z-normal/source-part-00.b64',
                  root/'z-normal/source-part-01.b64',
                  root/'source-part-02.b64',
                  root/'z-normal/source-part-03.b64',
                  root/'z-normal/source-part-04.b64',
              ]),
              ('z-normal-00-01', [
                  root/'z-normal/source-part-00.b64',
                  root/'z-normal/source-part-01.b64',
              ]),
          ]

          valid = []
          for label, parts in candidates:
              if not all(p.is_file() for p in parts):
                  print(f'[{label}] ausente')
                  continue
              text = ''.join(''.join(p.read_text(encoding='ascii').split()) for p in parts)
              padded = text + '=' * ((-len(text)) % 4)
              try:
                  raw = base64.b64decode(padded, validate=True)
                  gzip.decompress(raw)
                  with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as tf:
                      names = tf.getnames()
                      go_names = [n for n in names if n.endswith('.go')]
                      if not go_names:
                          raise ValueError('TAR sem fonte Go')
                      if not any(pathlib.PurePosixPath(n).name == 'main.go' for n in go_names):
                          raise ValueError('TAR sem main.go')
                      out = pathlib.Path('.diag-hz')/label
                      out.mkdir(parents=True, exist_ok=True)
                      tf.extractall(out)
                  valid.append((label, len(raw), names))
                  print(f'VALIDO [{label}] bytes={len(raw)} entradas={len(names)}')
              except Exception as exc:
                  print(f'INVALIDO [{label}] {type(exc).__name__}: {exc}')

          print('\n=== RESULTADO ===')
          if not valid:
              print('Nenhuma combinação conhecida formou um pacote íntegro.')
              raise SystemExit(2)

          for label, size, names in valid:
              print(f'CANDIDATO_VALIDO={label} bytes={size}')
              print('ARQUIVOS=' + ', '.join(names[:30]))
          PY

          echo "=== INDÍCIOS DE UI/VERSÃO NOS CANDIDATOS VÁLIDOS ==="
          grep -RniE "Horizonte|1\.4\.0|AFK|site|visual|menu|janela|launcher|updat" .diag-hz --include='*.go' | head -n 120 || true

          # Diagnóstico proposital: não permite que esta execução publique artefato.
          exit 78
