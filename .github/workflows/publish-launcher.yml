name: Publicar Horizonte AFK beta2 validada
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-launcher.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: horizonte-stable-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar artefato validado
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-cfcc-820e-9aa6-be054bf94200/raw?se=2026-09-06T09%3A10%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=7549e8b9-e71f-5e5b-a8fb-0214c4bbdf25&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T22%3A16%3A49Z&ske=2026-09-06T22%3A16%3A49Z&sks=b&skv=2026-02-06&sig=75xUucSQ3YfGngEcVH3W%2B6JvcKOQsXcWQtOtbIsrjlQ%3D'
        run: |
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o /tmp/hz-beta2.zip
          unzip -o /tmp/hz-beta2.zip Horizonte_AFK.exe -d .
      - name: Validar executável e preparar metadados
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,datetime
          root=pathlib.Path('.')
          exe=root/'Horizonte_AFK.exe'
          data=exe.read_bytes()
          expected='7cda729688f3ec8f729115ff6a78f7c9f19c4dc42f1b72079319f798781553fa'
          assert data[:2]==b'MZ'
          assert len(data)==2982400, len(data)
          assert hashlib.sha256(data).hexdigest()==expected
          meta={
            'product':'Horizonte AFK','channel':'beta','version':'1.6.7-beta.2',
            'published_at':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),
            'available':True,'mandatory':False,
            'download_url':'https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.7-beta.2/Horizonte_AFK.exe',
            'sha256':expected,'size_bytes':2982400,'encoding':'none',
            'notes':'Corrige a aplicação do Centro de Contas e garante que a interface final seja carregada e validada antes da publicação.',
            'min_supported_version':'1.2.0'
          }
          (root/'release-candidate.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          changes=json.loads((root/'release-changelog.json').read_text(encoding='utf-8-sig'))
          versions=[v for v in changes.get('versions',[]) if v.get('version')!='1.6.7-beta.2']
          versions.insert(0,{
            'version':'1.6.7-beta.2','date':'2026-09-06','changes':[
              'Corrigida a aplicação silenciosa do Centro de Contas que fazia a interface permanecer visualmente na v1.6.6-beta.4.',
              'A nova aba CONTAS agora é exigida na validação do executável final antes da publicação.',
              'Adicionado teste do PowerShell final e carregamento real da janela WPF para impedir promoção de builds com falha de runtime.',
              'Mantidos Centro de Contas, sessões locais/nuvem, login rápido, persistência Cloud e o fail-safe do modo local.'
            ]
          })
          changes['channel']='beta'; changes['versions']=versions
          (root/'release-changelog.json').write_text(json.dumps(changes,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (root/'RELEASE_NOTES.md').write_text('''# Horizonte AFK 1.6.7-beta.2\n\nCorreção do Centro de Contas e validação reforçada.\n\n- Corrige o caso em que o atualizador instalava a beta nova, mas a camada de CONTAS falhava e a interface continuava parecendo a v1.6.6-beta.4.\n- A aba CONTAS passa a ser obrigatória no teste da build final.\n- O PowerShell final e a janela WPF são carregados durante a validação antes da publicação.\n- Mantém sessões locais/nuvem, login rápido, persistência Cloud e fail-safe do modo local.\n\nSHA-256: 7cda729688f3ec8f729115ff6a78f7c9f19c4dc42f1b72079319f798781553fa\n''',encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(expected+'  Horizonte_AFK.exe\n',encoding='utf-8')
          PY
      - name: Publicar e conferir o executável oficial
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py
      - name: Confirmar download público sem credenciais
        run: |
          python3 - <<'PY'
          import hashlib,json,time,urllib.request
          m=json.load(open('release-candidate.json'))
          for attempt in range(8):
              try:
                  with urllib.request.urlopen(m['download_url'],timeout=60) as r: data=r.read()
                  assert len(data)==m['size_bytes']
                  assert hashlib.sha256(data).hexdigest()==m['sha256']
                  break
              except Exception:
                  if attempt==7: raise
                  time.sleep(5)
          PY
      - name: Ativar beta2 no updater e salvar artefato validado
        run: |
          cp release-candidate.json latest.json
          cp release-changelog.json changelog.json
          git config user.name 'Horizonte AFK Updater'
          git config user.email 'actions@users.noreply.github.com'
          git add Horizonte_AFK.exe release-candidate.json latest.json release-changelog.json changelog.json RELEASE_NOTES.md SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Publica Horizonte AFK 1.6.7-beta.2 [skip ci]'
            git push
          fi
