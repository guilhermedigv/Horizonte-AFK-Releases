name: Publicar Horizonte AFK

on:
  push:
    branches: [main]
    paths:
      - "Horizonte_AFK.exe"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar executável e ativar manifesto
        shell: bash
        run: |
          set -euo pipefail
          test -f Horizonte_AFK.exe
          # PE do Windows começa com MZ.
          test "$(head -c 2 Horizonte_AFK.exe)" = "MZ"

          HASH="$(sha256sum Horizonte_AFK.exe | awk '{print $1}')"
          SIZE="$(stat -c%s Horizonte_AFK.exe)"
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          python3 - "$HASH" "$SIZE" "$NOW" <<'PY'
          import json, sys
          from pathlib import Path

          sha256, size, now = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          p = Path('latest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['available'] = True
          data['published_at'] = now
          data['download_url'] = 'https://raw.githubusercontent.com/guilhermedigv/Horizonte-AFK-Releases/main/Horizonte_AFK.exe'
          data['sha256'] = sha256
          data['size_bytes'] = size
          # O arquivo público é o EXE final, sem compactação adicional.
          data['encoding'] = 'none'
          data.pop('parts', None)
          data.pop('part_encoding', None)
          data['notes'] = 'Versão estável publicada. Atualização automática por EXE único, com validação SHA-256, tela de progresso e reinicialização automática.'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commitar manifesto calculado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Horizonte AFK Updater"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Ativa atualização automática para $(python3 -c "import json; print(json.load(open('latest.json'))['version'])")"
          git push
