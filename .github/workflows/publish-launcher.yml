name: Publicar Horizonte AFK v1.4.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-launcher.yml"
      - "build/v1.4.0/READY"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Remontar fonte v1.4.0
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .build140
          mkdir -p .build140/source
          : > .build140/source.tgz.b64
          find build/v1.4.0/zz-small -maxdepth 1 -type f -name 'source-part-*.b64' -print | sort -V | while read -r f; do
            echo "Remontando $f"
            cat "$f" >> .build140/source.tgz.b64
          done
          base64 -d .build140/source.tgz.b64 > .build140/source.tgz
          gzip -t .build140/source.tgz
          tar -xzf .build140/source.tgz -C .build140/source
          echo 'Arquivos da fonte:'
          find .build140/source -type f -maxdepth 4 -print | sort

      - name: Compilar EXE único
        shell: bash
        run: |
          set -euo pipefail
          SRC=".build140/source"
          MOD="$(find "$SRC" -name go.mod -print -quit || true)"
          if [ -n "$MOD" ]; then
            DIR="$(dirname "$MOD")"
            echo "Compilando módulo em $DIR"
            cd "$DIR"
            go mod download
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "$GITHUB_WORKSPACE/Horizonte_AFK.exe" .
          else
            mapfile -t GOFILES < <(find "$SRC" -type f -name '*.go' | sort)
            if [ "${#GOFILES[@]}" -eq 0 ]; then
              echo 'Nenhum fonte Go encontrado.' >&2
              exit 1
            fi
            echo "Compilando ${#GOFILES[@]} arquivo(s) Go"
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o Horizonte_AFK.exe "${GOFILES[@]}"
          fi
          test -f Horizonte_AFK.exe
          test "$(head -c 2 Horizonte_AFK.exe)" = 'MZ'

      - name: Ativar manifesto oficial
        shell: bash
        run: |
          set -euo pipefail
          HASH="$(sha256sum Horizonte_AFK.exe | awk '{print $1}')"
          SIZE="$(stat -c%s Horizonte_AFK.exe)"
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 - "$HASH" "$SIZE" "$NOW" <<'PY'
          import json, sys
          from pathlib import Path
          sha256, size, now = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          p = Path('latest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data.update({
              'version': '1.4.0',
              'published_at': now,
              'available': True,
              'mandatory': False,
              'download_url': 'https://raw.githubusercontent.com/guilhermedigv/Horizonte-AFK-Releases/main/Horizonte_AFK.exe',
              'sha256': sha256,
              'size_bytes': size,
              'encoding': 'none',
              'notes': 'Horizonte AFK v1.4.0 oficial: novo visual inspirado no Horizonte, mantendo o núcleo de conexão e todos os dialogs validados.',
              'min_supported_version': '1.3.0'
          })
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('SHA256=', sha256)
          print('SIZE=', size)
          PY

      - name: Publicar no canal estável
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Horizonte AFK Updater'
          git config user.email 'actions@users.noreply.github.com'
          git add Horizonte_AFK.exe latest.json
          if git diff --cached --quiet; then
            echo 'Nada para publicar.'
            exit 0
          fi
          git commit -m 'Lança oficialmente Horizonte AFK v1.4.0'
          git push
