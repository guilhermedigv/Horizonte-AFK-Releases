name: Inspecionar base Horizonte AFK 1.3.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-launcher.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remontar fonte validada 1.3.1
        shell: bash
        run: |
          set -euo pipefail
          BASE_COMMIT=fdb93f40d17e86c2c3efd8f0442b62bc9bfffcd2
          rm -rf .base131
          mkdir -p .base131/source

          : > .base131/source.tgz.b64
          while IFS= read -r path; do
            echo "RECUPERANDO $path"
            git show "$BASE_COMMIT:$path" >> .base131/source.tgz.b64
          done < <(git ls-tree -r --name-only "$BASE_COMMIT" build/v1.3.1/source-parts | sort -V)

          base64 -d .base131/source.tgz.b64 > .base131/source.tgz
          gzip -t .base131/source.tgz
          tar -tzf .base131/source.tgz
          tar -xzf .base131/source.tgz -C .base131/source

          echo "=== TAMANHOS ==="
          find .base131/source -type f -printf '%s %p\n' | sort -n

          echo "=== ARQUIVOS GO ==="
          find .base131/source -type f -name '*.go' -print | sort

          echo "=== PACKAGE / IMPORTS / CONSTANTES / FUNÇÕES ==="
          grep -RniE '^(package|import|const|var|type|func) |Horizonte|AFK|version|manifest|update|conectar|servidor' .base131/source --include='*.go' | head -n 400 || true

          echo "=== SEGREDOS COM PREFIXO CONHECIDO (NÃO IMPRIME VALORES) ==="
          if grep -RqlE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}' .base131/source --include='*.go'; then
            echo 'ALERTA_SEGREDO=SIM'
          else
            echo 'ALERTA_SEGREDO=NAO'
          fi

          # Só inspeção; nenhuma publicação/alteração de manifesto.
          exit 78
