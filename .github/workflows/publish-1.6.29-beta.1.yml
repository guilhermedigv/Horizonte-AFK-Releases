name: Publicar Horizonte AFK 1.6.29 beta1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.6.29-beta.1.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar build validada
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-fe30-820e-870d-9851f3062e97/raw?se=2026-09-06T23%3A55%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=4d2fdd6d-7e62-5c53-a01b-2a0c4b0ab4fa&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T09%3A32%3A45Z&ske=2026-09-07T09%3A32%3A45Z&sks=b&skv=2026-02-06&sig=x1hpNS/Vq67DSy1ugZzJ4ekAaoA8KknI2Yxb3kfJX9w%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o artifact.zip
          rm -rf artifact && mkdir artifact
          unzip -q artifact.zip -d artifact
          EXE="$(find artifact -type f -name 'Horizonte_AFK.exe' -print -quit)"
          test -n "$EXE"
          cp "$EXE" Horizonte_AFK.exe
          SIZE=$(stat -c '%s' Horizonte_AFK.exe)
          SHA=$(sha256sum Horizonte_AFK.exe | awk '{print $1}')
          test "$SIZE" = '5841920'
          test "$SHA" = '401b68fbc957e63454141b57b26cf6593d65f0410eaf9b2b5cab8af47063c095'
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
      - name: Publicar release e manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='Corrige a confirmação de dialogs no multi-servidor. O ACK do RakSAMP agora é tratado somente como confirmação de transporte; o launcher espera separadamente a mudança real de sequência do diálogo do servidor. Isso elimina os falsos "dialog nativo não confirmou" e evita avançar a fila enquanto o usuário ainda está respondendo. Também corrige a regressão em que uma leitura momentaneamente vazia do state.json podia encerrar uma sessão já ativa como "não iniciou corretamente". Cloud 24/7, contas, updater, layout e otimizações anteriores foram preservados.'
          if gh release view 'v1.6.29-beta.1' >/dev/null 2>&1; then
            gh release upload 'v1.6.29-beta.1' Horizonte_AFK.exe --clobber
          else
            gh release create 'v1.6.29-beta.1' Horizonte_AFK.exe --title 'Horizonte AFK v1.6.29-beta.1' --notes "$NOTES" --prerelease
          fi
          cat > latest.json <<EOF
          {
            "product": "Horizonte AFK",
            "channel": "beta",
            "version": "1.6.29-beta.1",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "available": true,
            "mandatory": false,
            "download_url": "https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.29-beta.1/Horizonte_AFK.exe",
            "sha256": "$SHA",
            "size_bytes": $SIZE,
            "encoding": "none",
            "notes": "Separa ACK do RakSAMP da transição real do servidor no multi-servidor e impede encerramento falso por leitura transitória do state.json.",
            "min_supported_version": "1.2.0"
          }
          EOF
          git config user.name 'Horizonte AFK Release CI'
          git config user.email 'actions@users.noreply.github.com'
          git add latest.json
          git commit -m 'release: v1.6.29-beta.1' || true
          git push
