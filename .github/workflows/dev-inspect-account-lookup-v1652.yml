name: Dev build v1.6.52 account handoff fix
on:
  push:
    branches: [dev/accounts-chat-runtime-fix-v1.6.51]
    paths:
      - '.github/workflows/dev-inspect-account-lookup-v1652.yml'
permissions:
  contents: read
jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Download exact v1.6.51 base
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.51-beta.1/Horizonte_AFK.exe' -OutFile base.exe
          $h=(Get-FileHash base.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h -ne '4d8084036d42b801a7501d44fdf0c10a1156dc07c56ca1430ee5ee015694bb91'){throw "Unexpected base hash $h"}
      - name: Patch account card handoff and page selection
        shell: python
        run: |
          from pathlib import Path
          import re,hashlib
          a=Path('base.exe').read_bytes();b=bytearray(a)
          sm=b'function Refresh-HZAccountsCenter';em=b'# Horizonte AFK 1.6 desktop/tray + unified multi-session controller.'
          s=a.find(sm);e=a.find(em,s)
          if s<0 or e<0:raise SystemExit('Account Center region missing')
          region=a[s:e].decode('utf-8')
          old_func=re.search(r'function Open-HZUcpConnection\(\[string\]\$id\)\{.*?Show-HZConnectionCenter\}',region,re.S)
          if not old_func:raise SystemExit('Old Open-HZUcpConnection not found')
          new_func="""function Open-HZUcpConnection($v){$id=[string]$v.Id;$n=([string]$v.Nick).Trim();$i=Get-HZScalarInt $v.I -1;if(!$id -or !$n){throw 'Conta indisponível.'};$p=$null;foreach($x in @($script:hzAccountPages)){if([string]$x.AccountId-eq$id){$p=$x;break}};if($null-eq$p){foreach($x in @($script:hzAccountPages)){if(([string]$x.Nick).Equals($n,[StringComparison]::OrdinalIgnoreCase)-and[int]$x.ServerIndex-eq$i){$p=$x;break}}};if($null-eq$p){foreach($x in @($script:hzAccountPages)){if([string]::IsNullOrWhiteSpace([string]$x.AccountId)-and[string]::IsNullOrWhiteSpace([string]$x.Nick)){$p=$x;break}}};if($null-eq$p){$p=New-HZAccountPage $false $n $i $id $false};if($null-eq$p){throw 'Não foi possível abrir a conta.'};$p.AccountId=$id;$p.Nick=$n;$p.ServerIndex=$i;Save-HZAccountPages;Select-HZAccountPage ([string]$p.Id);Show-HZConnectionCenter}"""
          region=region[:old_func.start()]+new_func+region[old_func.end():]
          old_view="Server=$sv;Rules=('login rápido: '+$n)"
          new_view="Server=$sv;I=$i;Rules=('login rápido: '+$n)"
          if old_view not in region:raise SystemExit('Account view marker missing')
          region=region.replace(old_view,new_view,1)
          old_handler="$id=[string]$b.Tag;if(!$id){try{$id=[string]$b.DataContext.Id}catch{}};if($id){$script:ucpOpenConnectionId=$id;$script:ucpWindow.Close();$e.Handled=$true}"
          new_handler="$script:ucpOpenConnectionId=$b.DataContext;$script:ucpWindow.Close();$e.Handled=$true"
          if old_handler not in region:raise SystemExit('Old click handler marker missing')
          region=region.replace(old_handler,new_handler,1)
          old_tail="$id=[string]$script:ucpOpenConnectionId;$script:ucpWindow=$null;$script:ucpList=$null;$script:ucpSummary=$null;$script:ucpProfiles=@();if($id){try{Open-HZUcpConnection $id}catch{"
          new_tail="$v=$script:ucpOpenConnectionId;$script:ucpWindow=$null;$script:ucpList=$null;$script:ucpSummary=$null;$script:ucpProfiles=@();if($v){try{Open-HZUcpConnection $v}catch{"
          if old_tail not in region:raise SystemExit('Old post-dialog handoff marker missing')
          region=region.replace(old_tail,new_tail,1)
          old_len=e-s
          compact=[' FontWeight="Bold"']*8+[' FontWeight="SemiBold"',' FontFamily="Segoe UI"',' FontSize="13"',' FontSize="24"',' FontSize="11"',' FontSize="10"',' FontSize="9"',' BorderBrush="#18A9FF"',' BorderBrush="#285A76"',' BorderBrush="#31506D"',' BorderBrush="#23895D"',' BorderBrush="#71313C"']
          for token in compact:
              if len(region.encode('utf-8'))<=old_len:break
              region=region.replace(token,'',1)
          raw=region.encode('utf-8')
          if len(raw)>old_len:raise SystemExit(f'patched region too large {len(raw)} > {old_len}')
          gap=old_len-len(raw)
          if gap==1:raw+=b'\n'
          elif gap>=2:raw+=b'#'+b' '*(gap-2)+b'\n'
          if len(raw)!=old_len:raise SystemExit('fixed-size region mismatch')
          b[s:e]=raw
          oldv=b'1.6.51-beta.1';newv=b'1.6.52-beta.1';p=0;vc=0
          while True:
              j=b.find(oldv,p)
              if j<0:break
              b[j:j+len(oldv)]=newv;p=j+len(newv);vc+=1
          if vc<1:raise SystemExit('version marker missing')
          Path('Horizonte_AFK.exe').write_bytes(b)
          print('region_padding',gap,'version_replacements',vc,'candidate_sha256',hashlib.sha256(b).hexdigest(),'size',len(b))
      - name: Validate runtime-critical PowerShell
        shell: pwsh
        run: |
          $bytes=[IO.File]::ReadAllBytes((Resolve-Path 'Horizonte_AFK.exe'));$text=[Text.Encoding]::UTF8.GetString($bytes)
          foreach($m in @('1.6.52-beta.1','function Open-HZUcpConnection($v)','$script:ucpOpenConnectionId=$b.DataContext','I=$i;Rules=','New-HZAccountPage $false $n $i $id $false','Show-HZConnectionCenter')){if(-not$text.Contains($m)){throw "Missing marker $m"}}
          if($text.Contains('Get-HZAccountById -id $id;if($null-eq$a)')){throw 'Old broken account lookup path still embedded'}
          if($text.Contains("throw 'Conta sem página de conexão.'")){throw 'Old inverted page logic still embedded'}
          foreach($name in @('Open-HZUcpConnection','Show-HZAccountsCenter','New-HZAccountPage','Show-HZConnectionCenter')){$s=$text.IndexOf('function '+$name);if($s-lt0){throw "Missing function $name"};$e=$text.IndexOf("`nfunction ",$s+10);if($e-lt0){$e=[Math]::Min($text.Length,$s+40000)};[void][scriptblock]::Create($text.Substring($s,$e-$s));Write-Host "Parse OK: $name"}
      - name: Validate PE shape and preserved fixes
        shell: python
        run: |
          from pathlib import Path
          import hashlib,struct
          a=Path('base.exe').read_bytes();b=Path('Horizonte_AFK.exe').read_bytes()
          if len(a)!=len(b):raise SystemExit('PE size changed')
          def pe(x):
              o=struct.unpack_from('<I',x,0x3c)[0];n=struct.unpack_from('<H',x,o+6)[0];z=struct.unpack_from('<H',x,o+20)[0];q=o+24+z
              return [(x[q+i*40:q+i*40+8],struct.unpack_from('<II',x,q+i*40+16)) for i in range(n)]
          if pe(a)!=pe(b):raise SystemExit('PE section map changed')
          for m in (b'ServerClosed',b'learned',b'Get-HZActivePageCloudSessionId',b'reconciliation-only migration'):
              if m not in b:raise SystemExit('Missing preserved safety marker '+repr(m))
          print('final_sha256',hashlib.sha256(b).hexdigest(),'size',len(b))
      - uses: actions/upload-artifact@v4
        with:
          name: Horizonte-AFK-v1.6.52-account-chat-fix-candidate
          path: Horizonte_AFK.exe
          if-no-files-found: error
