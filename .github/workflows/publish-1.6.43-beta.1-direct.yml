name: Publicar Horizonte AFK 1.6.43 beta1 direct
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.6.43-beta.1-direct.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar build validada
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-3568-820e-8d19-2158af058c6d/raw?se=2026-09-07T04%3A58%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=5165e513-12e5-5329-9fc3-0ab5186e0ae3&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T13%3A27%3A48Z&ske=2026-09-07T13%3A27%3A48Z&sks=b&skv=2026-02-06&sig=WhMvNPbT1kU3AGsyBOujvxQLSso80Vrc/%2BBqDnvAS2U%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o artifact.zip
          rm -rf artifact && mkdir artifact
          unzip -q artifact.zip -d artifact
          EXE="$(find artifact -type f -name 'Horizonte_AFK.exe' -print -quit)"
          test -n "$EXE"
          cp "$EXE" Horizonte_AFK.exe
          SIZE=$(stat -c '%s' Horizonte_AFK.exe)
          SHA=$(sha256sum Horizonte_AFK.exe | cut -d' ' -f1)
          test "$SIZE" = '5896704'
          test "$SHA" = 'a8ad1a14edcd02dde7ab1e309de49d4dbe6179205e410efc90028d704d693bee'
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
      - name: Publicar release e manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='As abas de conta agora funcionam como paginas independentes de verdade. + NOVA CONTA abre uma pagina vazia, sem copiar nick, servidor, status ou log da conta anterior. Cada pagina preserva o proprio formulario, status, tempo e log; ao trocar de aba o launcher restaura somente o conteudo daquela conta. Paginas duplicadas herdadas da 1.6.42 sao limpas automaticamente.'
          if gh release view 'v1.6.43-beta.1' >/dev/null 2>&1; then
            gh release upload 'v1.6.43-beta.1' Horizonte_AFK.exe --clobber
          else
            gh release create 'v1.6.43-beta.1' Horizonte_AFK.exe --title 'Horizonte AFK v1.6.43-beta.1' --notes "$NOTES" --prerelease
          fi
          cat > latest.json <<EOF
          {
            "product": "Horizonte AFK",
            "channel": "beta",
            "version": "1.6.43-beta.1",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "available": true,
            "mandatory": false,
            "download_url": "https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.43-beta.1/Horizonte_AFK.exe",
            "sha256": "$SHA",
            "size_bytes": $SIZE,
            "encoding": "none",
            "notes": "As abas agora sao paginas independentes: nova conta abre vazia e cada pagina mantem seu proprio nick, servidor, status, tempo e log.",
            "min_supported_version": "1.2.0"
          }
          EOF
          git config user.name 'Horizonte AFK Release CI'
          git config user.email 'actions@users.noreply.github.com'
          git add latest.json
          git commit -m 'release: v1.6.43-beta.1' || true
          git push
