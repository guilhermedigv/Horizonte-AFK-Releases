name: Promover Horizonte AFK 1.6.4-beta

on:
  push:
    paths:
      - '.release-v1.6.4-beta'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-93ec-820e-b1ab-fe6c4a281a86/raw?se=2026-09-06T06%3A20%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=9a151ad3-a974-5867-82a3-5106ac05b7ed&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T22%3A13%3A16Z&ske=2026-09-06T22%3A13%3A16Z&sks=b&skv=2026-02-06&sig=E1Biilsk1s7bGkYR2GIUAwhA32shewQL41BmgiOvQY0%3D'
      ZIP_SHA256: 'e20bc1fd4b0a4982f7c50651dc344f511f0ba0285b89f2b5cc64aa3844f06507'
      EXE_SHA256: '66e64e3aeba26e6d504627167d1cd608dec970219e7fa82eaed169ace0cde51d'
      EXE_SIZE: '2905088'
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e validar beta compilada
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 1 "$ARTIFACT_URL" -o /tmp/Horizonte-AFK-1.6.4-beta.zip
          echo "$ZIP_SHA256  /tmp/Horizonte-AFK-1.6.4-beta.zip" | sha256sum -c -
          rm -rf /tmp/hz164 && mkdir -p /tmp/hz164
          unzip -q /tmp/Horizonte-AFK-1.6.4-beta.zip -d /tmp/hz164
          test -f /tmp/hz164/Horizonte_AFK.exe
          test "$(sha256sum /tmp/hz164/Horizonte_AFK.exe | awk '{print $1}')" = "$EXE_SHA256"
          test "$(stat -c%s /tmp/hz164/Horizonte_AFK.exe)" = "$EXE_SIZE"
          test "$(od -An -tx1 -N2 /tmp/hz164/Horizonte_AFK.exe | tr -d ' \n')" = "4d5a"
      - name: Preparar metadados beta
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/hz164/Horizonte_AFK.exe ./Horizonte_AFK.exe
          printf '%s  Horizonte_AFK.exe\n' "$EXE_SHA256" > SHA256SUMS.txt
          cat > release-candidate.json <<'JSON'
          {
            "product": "Horizonte AFK",
            "channel": "beta",
            "version": "1.6.4-beta",
            "published_at": "2026-09-06T06:20:00.000Z",
            "available": true,
            "mandatory": false,
            "download_url": "https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.4-beta/Horizonte_AFK.exe",
            "sha256": "66e64e3aeba26e6d504627167d1cd608dec970219e7fa82eaed169ace0cde51d",
            "size_bytes": 2905088,
            "encoding": "none",
            "notes": "Beta de teste do modo Cloud 24/7 integrado ao Horizonte AFK, preservando a base da v1.6.3.",
            "min_supported_version": "1.2.0"
          }
          JSON
          cat > RELEASE_NOTES.md <<'MD'
          # Horizonte AFK 1.6.4-beta

          Beta de teste da integração Cloud 24/7.

          - Base da v1.6.3 preservada.
          - Adiciona no painel acesso ao modo Cloud 24/7 hospedado em hzrp.discloud.app.
          - Mantém bandeja, tela cheia, multi-servidor, conta adicional, login, 2FA, dialogs e updater.
          - Build compilada e validada no GitHub Actions antes da promoção.

          SHA-256: `66e64e3aeba26e6d504627167d1cd608dec970219e7fa82eaed169ace0cde51d`
          MD
          python3 - <<'PY'
          import json
          p='release-changelog.json'
          d=json.load(open(p,encoding='utf-8-sig'))
          d['channel']='beta'
          d['versions']=[v for v in d.get('versions',[]) if v.get('version')!='1.6.4-beta']
          d['versions'].insert(0,{
            'version':'1.6.4-beta','date':'2026-09-06','changes':[
              'Adicionado acesso ao modo Cloud 24/7 pelo painel do Horizonte AFK.',
              'A integração usa o serviço hzrp.discloud.app já validado na Discloud.',
              'Base da v1.6.3, bandeja, multi-servidor, conta adicional, login, 2FA, dialogs e updater foram preservados.',
              'Versão publicada como beta para teste antes de substituir a versão estável.'
            ]})
          open(p,'w',encoding='utf-8').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Promover beta para o canal GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Horizonte AFK Release Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add Horizonte_AFK.exe SHA256SUMS.txt release-candidate.json release-changelog.json RELEASE_NOTES.md
          git commit -m 'Promove executável validado do Horizonte AFK 1.6.4-beta'
          git push
