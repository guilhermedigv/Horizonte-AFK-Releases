name: Promover Horizonte AFK 1.6.1

on:
  push:
    paths:
      - '.release-v1.6.1'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-a06c-820e-97fc-fde8e4c033e1/raw?se=2026-09-06T04%3A32%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=a2a302e6-6557-5092-afa2-c42c54a5f26c&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T22%3A15%3A24Z&ske=2026-09-06T22%3A15%3A24Z&sks=b&skv=2026-02-06&sig=NjzkaePG3R%2Bl8tGkkaqRAPk3Vg/vsJ/UGpZSP%2BTvAz4%3D'
      ZIP_SHA256: '68cfb74c967fe13ba54d518fe2c498bdc35cb95542e5eaecb45afefa702d70cb'
      EXE_SHA256: '5439a662f7bb75f45aa07450a2174008d1a81041c80e786787613dcf64629b5b'
      EXE_SIZE: '2889728'
    steps:
      - uses: actions/checkout@v4

      - name: Baixar e validar artefato privado
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 1 "$ARTIFACT_URL" -o /tmp/Horizonte-AFK-1.6.1.zip
          echo "$ZIP_SHA256  /tmp/Horizonte-AFK-1.6.1.zip" | sha256sum -c -
          rm -rf /tmp/hz161
          mkdir -p /tmp/hz161
          unzip -q /tmp/Horizonte-AFK-1.6.1.zip -d /tmp/hz161
          test -f /tmp/hz161/Horizonte_AFK.exe
          actual="$(sha256sum /tmp/hz161/Horizonte_AFK.exe | awk '{print $1}')"
          test "$actual" = "$EXE_SHA256"
          size="$(stat -c%s /tmp/hz161/Horizonte_AFK.exe)"
          test "$size" = "$EXE_SIZE"
          magic="$(od -An -tx1 -N2 /tmp/hz161/Horizonte_AFK.exe | tr -d ' \n')"
          test "$magic" = "4d5a"

      - name: Preparar arquivos oficiais
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/hz161/Horizonte_AFK.exe ./Horizonte_AFK.exe
          printf '%s  Horizonte_AFK.exe\n' "$EXE_SHA256" > SHA256SUMS.txt
          published="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          python - "$published" <<'PY'
          import json, sys
          published = sys.argv[1]
          candidate = {
            "product": "Horizonte AFK",
            "channel": "stable",
            "version": "1.6.1",
            "published_at": published,
            "available": True,
            "mandatory": False,
            "download_url": "https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.1/Horizonte_AFK.exe",
            "sha256": "5439a662f7bb75f45aa07450a2174008d1a81041c80e786787613dcf64629b5b",
            "size_bytes": 2889728,
            "encoding": "none",
            "notes": "Corrige a persistência do ícone na bandeja e permite conectar uma conta adicional com nick diferente enquanto o multi-servidor permanece ativo.",
            "min_supported_version": "1.2.0"
          }
          with open('release-candidate.json','w',encoding='utf-8') as f:
              json.dump(candidate,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY

      - name: Promover EXE validado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Horizonte AFK Release Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add Horizonte_AFK.exe SHA256SUMS.txt release-candidate.json
          if git diff --cached --quiet; then
            echo 'Arquivos já estão promovidos.'
          else
            git commit -m 'Promove executável validado do Horizonte AFK 1.6.1'
            git push
          fi
