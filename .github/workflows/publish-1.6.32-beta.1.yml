name: Publicar Horizonte AFK 1.6.32 beta1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-1.6.32-beta.1.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar build validada
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-a46c-820e-a405-338f38f0a87c/raw?se=2026-09-07T00%3A32%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=a19e1503-af34-5837-9466-8bcaa5e05a80&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T11%3A34%3A19Z&ske=2026-09-07T11%3A34%3A19Z&sks=b&skv=2026-02-06&sig=27DPx6sHKNezIbji/46hd/xGB7xBwUaYzJqx4hASfmo%3D'
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o artifact.zip
          rm -rf artifact && mkdir artifact
          unzip -q artifact.zip -d artifact
          EXE="$(find artifact -type f -name 'Horizonte_AFK.exe' -print -quit)"
          test -n "$EXE"
          cp "$EXE" Horizonte_AFK.exe
          SIZE=$(stat -c '%s' Horizonte_AFK.exe)
          SHA=$(sha256sum Horizonte_AFK.exe | awk '{print $1}')
          test "$SIZE" = '5843968'
          test "$SHA" = 'c06087c3c23e17fe3ccd8d67d07e14a211492f7f80d9b92008d3ad685a6af951'
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
      - name: Publicar release e manifesto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='Correção aprofundada do transporte de dialogs. O RakSAMP agora consome respostas antes de processar novos RPCs de diálogo e não apaga mais uma resposta pendente quando o servidor publica/fecha outro diálogo. Isso elimina a corrida que causava mensagens intermitentes de "RakSAMP não confirmou o recebimento", repetição de senha e bloqueio antes do diálogo de spawn. O multi-servidor simultâneo, Cloud 24/7, contas, layout e updater foram preservados. Também foi adicionada telemetria segura no núcleo sem registrar senhas.'
          if gh release view 'v1.6.32-beta.1' >/dev/null 2>&1; then
            gh release upload 'v1.6.32-beta.1' Horizonte_AFK.exe --clobber
          else
            gh release create 'v1.6.32-beta.1' Horizonte_AFK.exe --title 'Horizonte AFK v1.6.32-beta.1' --notes "$NOTES" --prerelease
          fi
          cat > latest.json <<EOF
          {
            "product": "Horizonte AFK",
            "channel": "beta",
            "version": "1.6.32-beta.1",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "available": true,
            "mandatory": false,
            "download_url": "https://github.com/guilhermedigv/Horizonte-AFK-Releases/releases/download/v1.6.32-beta.1/Horizonte_AFK.exe",
            "sha256": "$SHA",
            "size_bytes": $SIZE,
            "encoding": "none",
            "notes": "Corrige a corrida interna que fazia o RakSAMP perder respostas de dialogs, repetir a senha e impedir a transição para o spawn.",
            "min_supported_version": "1.2.0"
          }
          EOF
          git config user.name 'Horizonte AFK Release CI'
          git config user.email 'actions@users.noreply.github.com'
          git add latest.json
          git commit -m 'release: v1.6.32-beta.1' || true
          git push
