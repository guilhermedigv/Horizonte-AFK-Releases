name: Construir Horizonte AFK 1.5.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-1.5.0.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false

      - name: Reconstruir fontes e extrair payload validado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path build/payload -Force | Out-Null
          python - <<'PY'
          from pathlib import Path
          import hashlib

          src = Path('build-src/v1.5.0')
          out = Path('build')
          out.mkdir(exist_ok=True)
          (out/'main.go').write_bytes((src/'main.go.part1').read_bytes() + (src/'main.go.part2').read_bytes())
          (out/'features.go').write_bytes((src/'features.go.part1').read_bytes() + (src/'features.go.part2').read_bytes())
          (out/'go.mod').write_bytes((src/'go.mod').read_bytes())

          def git_blob_sha(data: bytes) -> str:
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()

          expected_sources = {
              'main.go': '0bb5cfba9c30321c9dae35e78469d969f6c21a64',
              'features.go': '1bf6071e57708995395b051c24d9a67df2482bed',
              'go.mod': '76ce0ae64063d05cc6dac43557ffaa9de00d17f5',
          }
          for name, expected in expected_sources.items():
              actual = git_blob_sha((out/name).read_bytes())
              if actual != expected:
                  raise SystemExit(f'{name}: fonte remontada difere da validada: {actual}')

          old = Path('Horizonte_AFK.exe').read_bytes()
          payload = out/'payload'

          # Extrai o PowerShell original exatamente como foi embutido na linha 1.4.x.
          sig = b'\xef\xbb\xbf# Horizonte AFK Launcher'
          end_marker = b'$window.ShowDialog() | Out-Null'
          expected_ps_git = '48b50562313f13c807d269575e85a93e21fb4a0c'
          ps = None
          start = 0
          while True:
              i = old.find(sig, start)
              if i < 0:
                  break
              j = old.find(end_marker, i)
              if j >= 0:
                  base_end = j + len(end_marker)
                  for extra in range(0, 9):
                      candidate = old[i:base_end+extra]
                      if git_blob_sha(candidate) == expected_ps_git:
                          ps = candidate
                          break
              if ps is not None:
                  break
              start = i + 1
          if ps is None:
              raise SystemExit('Não foi possível recuperar o payload PowerShell validado do EXE 1.4.x')
          (payload/'Horizonte-AFK.ps1').write_bytes(ps)

          def find_exact(sig: bytes, size: int, expected_sha256: str) -> bytes:
              pos = 0
              while True:
                  i = old.find(sig, pos)
                  if i < 0:
                      break
                  candidate = old[i:i+size]
                  if len(candidate) == size and hashlib.sha256(candidate).hexdigest() == expected_sha256:
                      return candidate
                  pos = i + 1
              raise SystemExit(f'Recurso {expected_sha256[:12]} não encontrado no EXE 1.4.x')

          engine = find_exact(b'MZ', 409088, 'b63de2af9dff1fbea4f79897054576788c57427637385ab92397999cdac9320c')
          hero = find_exact(b'\xff\xd8\xff', 57574, '1180813a64ac04474c6f4f76df4f7f42648e6b523a2aabaea76b5550597b4d6e')
          icon = find_exact(b'\x89PNG\r\n\x1a\n', 32380, '5f96d07d9af05c40f1f4700136438311b2b9204e6e6a0e4475e4441111fe317a')
          (payload/'RakSAMPClient.exe').write_bytes(engine)
          (payload/'hero_bg.jpg').write_bytes(hero)
          (payload/'hz_icon.png').write_bytes(icon)
          print('Fontes e payload 1.4.x conferidos por hash.')
          PY

      - name: Compilar e exigir o mesmo hash da build validada
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location build
          try {
            $env:CGO_ENABLED='0'
            go build -trimpath -ldflags '-s -w -H=windowsgui' -o Horizonte_AFK.exe .
            if($LASTEXITCODE-ne0){ throw 'A compilação falhou.' }
            $hash = (Get-FileHash -LiteralPath Horizonte_AFK.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            $size = (Get-Item -LiteralPath Horizonte_AFK.exe).Length
            if($hash -ne '847df6749ed57971c631a05b26428ccb4e2adfa185369799edd5c02ea8d64b07'){
              throw ('Hash da reconstrução pública não confere com a build privada validada: ' + $hash)
            }
            if($size -ne 2841088){ throw ('Tamanho inesperado: ' + $size) }
          } finally { Pop-Location }

      - name: Promover binário validado para a raiz sem ativar manifesto
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -LiteralPath build/Horizonte_AFK.exe -Destination Horizonte_AFK.exe -Force
          @{
            version='1.5.0'
            sha256='847df6749ed57971c631a05b26428ccb4e2adfa185369799edd5c02ea8d64b07'
            size_bytes=2841088
            validated_against='private-ci-and-public-rebuild'
          } | ConvertTo-Json | Set-Content -LiteralPath build-result-1.5.0.json -Encoding utf8
          git config user.name 'Horizonte AFK Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add Horizonte_AFK.exe build-result-1.5.0.json
          git commit -m 'Adiciona executável validado do Horizonte AFK 1.5.0'
          git push
