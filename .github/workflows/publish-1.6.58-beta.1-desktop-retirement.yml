name: Publicar Horizonte AFK 1.6.58 beta1 desktop retirement
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          cache: false
      - name: Confirmar release final existente
        shell: powershell
        run: |
          $m=Get-Content latest.json -Raw -Encoding UTF8|ConvertFrom-Json
          if([string]$m.version-ne'1.6.58-beta.1'){throw "Manifesto final inesperado: $($m.version)"}
          if([string]$m.sha256-ne'0be04dc927ea5115f9f73574001f188b2bb1b502e0ad61707f7a5c53e4e0ba49'){throw 'Hash final inesperado'}
      - name: Testar aviso final
        shell: powershell
        working-directory: desktop-retirement
        run: go test ./...
      - name: Compilar candidato reproduzivel duas vezes
        shell: powershell
        working-directory: desktop-retirement
        run: |
          New-Item -ItemType Directory -Force candidateA,candidateB|Out-Null
          go build -trimpath -buildvcs=false -ldflags="-s -w -H windowsgui" -o candidateA/Horizonte_AFK.exe .
          go build -trimpath -buildvcs=false -ldflags="-s -w -H windowsgui" -o candidateB/Horizonte_AFK.exe .
      - name: Validar artefato final
        shell: powershell
        run: |
          $a='desktop-retirement/candidateA/Horizonte_AFK.exe'
          $b='desktop-retirement/candidateB/Horizonte_AFK.exe'
          $shaA=(Get-FileHash $a -Algorithm SHA256).Hash.ToLowerInvariant()
          $shaB=(Get-FileHash $b -Algorithm SHA256).Hash.ToLowerInvariant()
          if($shaA-ne$shaB){throw "Build nao reproduzivel: $shaA != $shaB"}
          if($shaA-ne'0be04dc927ea5115f9f73574001f188b2bb1b502e0ad61707f7a5c53e4e0ba49'){throw "Hash diferente da release final: $shaA"}
          $size=(Get-Item $a).Length
          if($size-ne1485312){throw "Tamanho diferente da release final: $size"}
          $bytes=[IO.File]::ReadAllBytes($a)
          if($bytes[0]-ne0x4D-or$bytes[1]-ne0x5A){throw 'Executavel PE invalido'}
          $src=Get-Content desktop-retirement/main.go -Raw -Encoding UTF8
          if(-not $src.Contains('Menu descontinuado')){throw 'Aviso de descontinuacao ausente'}
          if(-not $src.Contains('hzrp.discloud.app/panel')){throw 'URL do painel ausente'}
          if($src.Contains('RakSAMPClient')-or$src.Contains('Horizonte-AFK.ps1')){throw 'O EXE final nao pode carregar o runtime antigo'}
      - name: Verificar asset publicado
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force verify|Out-Null
          gh release download v1.6.58-beta.1 --pattern Horizonte_AFK.exe --dir verify
          $got=(Get-FileHash verify/Horizonte_AFK.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $gotSize=(Get-Item verify/Horizonte_AFK.exe).Length
          if($got-ne'0be04dc927ea5115f9f73574001f188b2bb1b502e0ad61707f7a5c53e4e0ba49'){throw "Asset publicado inesperado: $got"}
          if($gotSize-ne1485312){throw "Tamanho publicado inesperado: $gotSize"}
      - name: Garantir manifestos JSON sem BOM
        shell: powershell
        run: |
          $utf8NoBom=New-Object System.Text.UTF8Encoding($false)
          $latest=Get-Content latest.json -Raw -Encoding UTF8|ConvertFrom-Json
          $candidate=Get-Content release-candidate.json -Raw -Encoding UTF8|ConvertFrom-Json
          [IO.File]::WriteAllText((Join-Path $PWD 'latest.json'),(($latest|ConvertTo-Json -Depth 8)+[Environment]::NewLine),$utf8NoBom)
          [IO.File]::WriteAllText((Join-Path $PWD 'release-candidate.json'),(($candidate|ConvertTo-Json -Depth 8)+[Environment]::NewLine),$utf8NoBom)
          if([IO.File]::ReadAllBytes('latest.json')[0]-eq0xEF){throw 'latest.json ainda possui BOM'}
          git diff --exit-code -- latest.json release-candidate.json
